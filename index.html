<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1,
  maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DELTARUNE">

<title>DELTARUNE</title>

<link rel="manifest" href="./manifest.json">

<link
  rel="icon"
  type="image/png"
  href="./icons/appicon.png"
>

<link
  rel="apple-touch-icon"
  href="./icons/appicon.png"
>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

@font-face {
  font-family: "Deltarune";
  src: url("https://cdn.jsdelivr.net/gh/ByAlvaro19/deltarune/font.otf")
       format("opentype");
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background: #000;
  color: #fff;
  overflow: hidden;
}

body {
  font-family: "Deltarune", monospace;
}

/* =========================================================
   MENU
========================================================= */

#main-menu-ui {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;

  overflow-y: auto;
  overflow-x: hidden;

  display: flex;
  flex-direction: column;
  align-items: center;

  padding:
    max(20px, env(safe-area-inset-top))
    20px
    100px;

  background: #000;

  z-index: 10;
}

#main-menu-ui::-webkit-scrollbar {
  display: none;
}

.logo-container {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.logo {
  width: min(700px, 90vw);
  height: auto;
  max-height: 200px;
  object-fit: contain;
  display: block;
}

/* =========================================================
   MENU CENTRALIZADO
========================================================= */

.menu {
  width: min(90vw, 800px);
  margin: 20px auto 0;

  display: flex;
  flex-direction: column;
  align-items: stretch;
}

.row,
.disabled-row {
  width: 100%;

  display: grid;

  grid-template-columns:
    minmax(150px, 200px)
    minmax(0, 1fr)
    60px;

  align-items: center;

  padding: 12px 0;

  gap: 16px;

  color: #fff;
  text-decoration: none;

  touch-action: manipulation;
}

.row {
  cursor: pointer;
}

.disabled-row {
  opacity: .55;
}

.chapter,
.title,
.disabled-title,
.badge {
  display: inline-block;
  transform: scaleY(1.1);
  transform-origin: bottom;
}

.chapter {
  text-align: left;
}

.title {
  text-align: center;
}

.disabled-title {
  text-align: center;
}

.row img,
.disabled-row img {
  width: 60px;
  height: 50px;
  object-fit: contain;
  image-rendering: pixelated;
}

.row:hover .chapter,
.row:hover .title,
.row.selected .chapter,
.row.selected .title {
  color: #fefe00;
}

.row:hover img,
.row.selected img {
  filter: sepia(1) saturate(100);
}

/* =========================================================
   WARNING
========================================================= */

.deactivation-warning {
  width: min(90vw, 700px);
  margin: 10px auto 20px;

  text-align: center;

  font-family: Arial, sans-serif;
  font-size: 15px;
  line-height: 1.4;
}

.deactivation-warning a {
  color: #ffff00;
}

/* =========================================================
   LOADER
========================================================= */

#loader-screen {
  position: fixed;
  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  background: #000;
  color: #fff;

  z-index: 100;

  font-family: Arial, sans-serif;
}

/* =========================================================
   GAME
========================================================= */

#game-frame {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100vh;
  height: 100dvh;

  border: 0;
  outline: 0;

  display: none;

  background: #000;

  z-index: 1;
}

/* =========================================================
   MOBILE HUD
========================================================= */

#hud-layer {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 20;

  display: none;

  pointer-events: none;

  opacity: var(--ctrl-opacity, 1);

  touch-action: none;
}

/* =========================================================
   JOYSTICK
========================================================= */

#joystick {
  position: absolute;

  left: 90px;
  bottom: 90px;

  width: 150px;
  height: 150px;

  border-radius: 50%;

  pointer-events: auto;
  touch-action: none;

  transform: scale(var(--ctrl-scale, 1.3));
  transform-origin: center;

  background:
    rgba(255,255,255,.10);

  border:
    3px solid rgba(255,255,255,.30);

  box-shadow:
    0 0 25px rgba(255,255,255,.08),
    inset 0 0 25px rgba(0,0,0,.5);
}

#joystick-stick {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 68px;
  height: 68px;

  margin-left: -34px;
  margin-top: -34px;

  border-radius: 50%;

  background:
    rgba(255,255,255,.78);

  border:
    3px solid rgba(255,255,255,.95);

  box-shadow:
    0 5px 20px rgba(0,0,0,.6);

  pointer-events: none;

  transition:
    transform .04s linear;
}

/* =========================================================
   Z X C
========================================================= */

#mobile-buttons {
  position: absolute;

  right: 70px;
  bottom: 80px;

  display: flex;
  flex-direction: column;

  gap: 14px;

  pointer-events: auto;
  touch-action: none;

  transform: scale(var(--ctrl-scale, 1.3));
  transform-origin: center;
}

.game-btn {
  width: 65px;
  height: 65px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    rgba(255,255,255,.14);

  border:
    2px solid rgba(255,255,255,.4);

  color: #fff;

  font-family: Arial, sans-serif;
  font-size: 25px;
  font-weight: bold;

  touch-action: none;

  pointer-events: auto;

  box-shadow:
    0 0 15px rgba(255,255,255,.08),
    inset 0 0 15px rgba(0,0,0,.4);
}

.game-btn.active {
  background: rgba(255,255,255,.55);

  transform: scale(.92);

  border-color: #fff;
}

/* =========================================================
   SETTINGS
========================================================= */

#settings-bar {
  position: fixed;

  top: max(10px, env(safe-area-inset-top));
  right: max(10px, env(safe-area-inset-right));

  z-index: 50;

  display: none;

  gap: 5px;
}

#settings-toggle {
  padding: 9px 12px;

  color: #fff;
  background: rgba(20,20,20,.9);

  border: 1px solid #777;
  border-radius: 7px;

  font-family: Arial, sans-serif;
}

#settings-panel {
  position: fixed;

  top:
    max(
      60px,
      calc(env(safe-area-inset-top) + 50px)
    );

  right:
    max(
      10px,
      env(safe-area-inset-right)
    );

  width: 230px;

  padding: 18px;

  display: none;

  background: rgba(0,0,0,.96);

  border: 1px solid #444;
  border-radius: 10px;

  z-index: 49;

  font-family: Arial, sans-serif;
}

#settings-panel input {
  width: 100%;
}

#reset-pos {
  width: 100%;
  margin-top: 10px;

  padding: 10px;

  background: #922;
  color: #fff;

  border: 0;
  border-radius: 6px;
}

/* =========================================================
   EDIT MODE
========================================================= */

body.edit-mode #joystick,
body.edit-mode #mobile-buttons {
  outline: 2px dashed #00bfff;
  background: rgba(0,191,255,.12);
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

  #main-menu-ui {
    padding-top:
      max(
        10px,
        env(safe-area-inset-top)
      );
  }

  .logo {
    width: 90vw;
    max-height: 150px;
  }

  .menu {
    width: 94vw;
  }

  .row,
  .disabled-row {
    grid-template-columns:
      110px
      minmax(0, 1fr)
      48px;

    gap: 8px;

    font-size: 22px;
  }

  .row img,
  .disabled-row img {
    width: 48px;
    height: 42px;
  }

  #joystick {
    left: 65px;
    bottom: 75px;

    width: 135px;
    height: 135px;
  }

  #joystick-stick {
    width: 62px;
    height: 62px;

    margin-left: -31px;
    margin-top: -31px;
  }

  #mobile-buttons {
    right: 45px;
    bottom: 65px;
  }

  .game-btn {
    width: 60px;
    height: 60px;
  }
}

@media (max-width: 450px) {

  .row,
  .disabled-row {
    grid-template-columns:
      90px
      minmax(0,1fr)
      42px;

    font-size: 18px;
  }

  #joystick {
    left: 30px;
    bottom: 35px;

    width: 120px;
    height: 120px;
  }

  #joystick-stick {
    width: 55px;
    height: 55px;

    margin-left: -27.5px;
    margin-top: -27.5px;
  }

  #mobile-buttons {
    right: 25px;
    bottom: 30px;

    gap: 8px;
  }

  .game-btn {
    width: 55px;
    height: 55px;
    font-size: 21px;
  }
}

</style>
</head>

<script>

"use strict";

/* =========================================================
   REPOSITORY
========================================================= */

const REPO_BASE =
  "https://cdn.jsdelivr.net/gh/ByAlvaro19/deltarune/";

/* =========================================================
   ELEMENTS
========================================================= */

const frame =
  document.getElementById("game-frame");

const hud =
  document.getElementById("hud-layer");

const menu =
  document.getElementById("main-menu-ui");

const loader =
  document.getElementById("loader-screen");

const joystick =
  document.getElementById("joystick");

const joystickStick =
  document.getElementById("joystick-stick");

const mobileRow =
  document.getElementById("mobile-controls-row");

const mobileStatus =
  document.getElementById(
    "mobile-controls-status-text"
  );

const settingsBar =
  document.getElementById("settings-bar");

const settingsPanel =
  document.getElementById("settings-panel");

const importFile =
  document.getElementById("importFile");

/* =========================================================
   AUDIO
========================================================= */

/*
 * IMPORTANTE:
 *
 * snd_menumove.mp3 FOI REMOVIDO.
 *
 * Não existe mais som ao passar pelos capítulos
 * nem ao navegar pelo Chapter Choose.
 */

const sndSelect =
  new Audio(
    REPO_BASE + "audios/snd_select.mp3"
  );

sndSelect.preload = "auto";

function playSelect() {

  try {

    sndSelect.currentTime = 0;

    const p = sndSelect.play();

    if (p) {
      p.catch(() => {});
    }

  } catch (_) {}

}

/* =========================================================
   STATE
========================================================= */

let gameStarted = false;

let mobileControls = false;

let selectedIndex = null;

let joystickPointer = null;

const activeKeys = new Set();

const MOBILE_KEY =
  "deltarune-mobile-toggle";

const CONFIG_KEY =
  "deltarune-mobile-config";

let config = {

  opacity: 1,

  scale: 1.3

};

/* =========================================================
   KEY MAP
========================================================= */

const keyMap = {

  ArrowUp: 38,
  ArrowDown: 40,
  ArrowLeft: 37,
  ArrowRight: 39,

  z: 90,
  x: 88,
  c: 67

};

/* =========================================================
   SEND INPUT TO GAME
========================================================= */

function sendGameKey(type, key) {

  try {

    if (
      !frame.contentWindow
    ) {
      return;
    }

    frame.contentWindow.postMessage(
      {
        type: type,
        key: key,
        keyCode: keyMap[key] || 0
      },
      "*"
    );

  } catch (_) {}

}

function updateKey(key, down) {

  if (!keyMap[key]) {
    return;
  }

  if (down) {

    if (activeKeys.has(key)) {
      return;
    }

    activeKeys.add(key);

    sendGameKey(
      "keydown",
      key
    );

  } else {

    if (!activeKeys.has(key)) {
      return;
    }

    activeKeys.delete(key);

    sendGameKey(
      "keyup",
      key
    );

  }

}

function releaseAllKeys() {

  for (
    const key of Array.from(activeKeys)
  ) {

    sendGameKey(
      "keyup",
      key
    );

    activeKeys.delete(key);

  }

}

/* =========================================================
   MOBILE TOGGLE
========================================================= */

function updateMobileText() {

  mobileStatus.textContent =
    "Mobile controls: " +
    (
      mobileControls
        ? "ON"
        : "OFF"
    );

}

function toggleMobile() {

  playSelect();

  mobileControls =
    !mobileControls;

  try {

    localStorage.setItem(
      MOBILE_KEY,
      mobileControls
        ? "true"
        : "false"
    );

  } catch (_) {}

  updateMobileText();

  updateHUD();

}

function updateHUD() {

  if (
    gameStarted &&
    mobileControls
  ) {

    hud.style.display =
      "block";

    settingsBar.style.display =
      "flex";

  } else {

    hud.style.display =
      "none";

    settingsBar.style.display =
      "none";

    settingsPanel.style.display =
      "none";

    releaseAllKeys();

  }

}

/* =========================================================
   JOYSTICK
========================================================= */

function resetJoystick() {

  joystickStick.style.transform =
    "translate(0px, 0px)";

}

function joystickMove(x, y) {

  const rect =
    joystick.getBoundingClientRect();

  const cx =
    rect.left +
    rect.width / 2;

  const cy =
    rect.top +
    rect.height / 2;

  let dx = x - cx;
  let dy = y - cy;

  const radius =
    rect.width * .34;

  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  if (distance > radius) {

    const factor =
      radius / distance;

    dx *= factor;
    dy *= factor;

  }

  joystickStick.style.transform =
    `translate(${dx}px, ${dy}px)`;

  const deadzone = 18;

  const keys = {

    ArrowUp:
      dy < -deadzone,

    ArrowDown:
      dy > deadzone,

    ArrowLeft:
      dx < -deadzone,

    ArrowRight:
      dx > deadzone

  };

  updateKey(
    "ArrowUp",
    keys.ArrowUp
  );

  updateKey(
    "ArrowDown",
    keys.ArrowDown
  );

  updateKey(
    "ArrowLeft",
    keys.ArrowLeft
  );

  updateKey(
    "ArrowRight",
    keys.ArrowRight
  );

}

joystick.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    joystickPointer =
      event.pointerId;

    try {
      joystick.setPointerCapture(
        event.pointerId
      );
    } catch (_) {}

    joystickMove(
      event.clientX,
      event.clientY
    );

  },
  {
    passive: false
  }
);

joystick.addEventListener(
  "pointermove",
  event => {

    if (
      event.pointerId !==
      joystickPointer
    ) {
      return;
    }

    event.preventDefault();

    joystickMove(
      event.clientX,
      event.clientY
    );

  },
  {
    passive: false
  }
);

function releaseJoystick(event) {

  if (
    joystickPointer !== null &&
    event.pointerId !==
    joystickPointer
  ) {
    return;
  }

  joystickPointer = null;

  resetJoystick();

  updateKey(
    "ArrowUp",
    false
  );

  updateKey(
    "ArrowDown",
    false
  );

  updateKey(
    "ArrowLeft",
    false
  );

  updateKey(
    "ArrowRight",
    false
  );

}

joystick.addEventListener(
  "pointerup",
  releaseJoystick,
  {
    passive: false
  }
);

joystick.addEventListener(
  "pointercancel",
  releaseJoystick,
  {
    passive: false
  }
);

joystick.addEventListener(
  "lostpointercapture",
  releaseJoystick
);

/* =========================================================
   Z X C
========================================================= */

document
  .querySelectorAll(".game-btn")
  .forEach(button => {

    const key =
      button.dataset.key;

    let pointerId = null;

    button.addEventListener(
      "pointerdown",
      event => {

        event.preventDefault();

        pointerId =
          event.pointerId;

        try {

          button.setPointerCapture(
            pointerId
          );

        } catch (_) {}

        updateKey(
          key,
          true
        );

        button.classList.add(
          "active"
        );

      },
      {
        passive: false
      }
    );

    function release(event) {

      if (
        pointerId !== null &&
        event.pointerId !==
        pointerId
      ) {
        return;
      }

      event.preventDefault();

      updateKey(
        key,
        false
      );

      button.classList.remove(
        "active"
      );

      pointerId = null;

    }

    button.addEventListener(
      "pointerup",
      release,
      {
        passive: false
      }
    );

    button.addEventListener(
      "pointercancel",
      release,
      {
        passive: false
      }
    );

    button.addEventListener(
      "lostpointercapture",
      () => {

        updateKey(
          key,
          false
        );

        button.classList.remove(
          "active"
        );

        pointerId = null;

      }
    );

  });

/* =========================================================
   LOAD CHAPTER
========================================================= */

async function loadChapter(chapter) {

  playSelect();

  gameStarted = true;

  releaseAllKeys();

  menu.style.display =
    "none";

  loader.style.display =
    "flex";

  frame.style.display =
    "block";

  updateHUD();

  const chapterPath =
    `${REPO_BASE}chapter${chapter}/`;

  const chapterURL =
    `${chapterPath}index.html`;

  try {

    const response =
      await fetch(
        chapterURL,
        {
          cache: "no-cache"
        }
      );

    if (!response.ok) {
      throw new Error(
        "HTTP " +
        response.status
      );
    }

    const html =
      await response.text();

    if (!html.trim()) {
      throw new Error(
        "Empty chapter"
      );
    }

    /*
     * Apenas adiciona <base>.
     * Não injeta KeyboardEvents no jogo.
     */

    let finalHTML =
      html.replace(
        /<base\b[^>]*>/gi,
        ""
      );

    if (
      /<head[^>]*>/i.test(
        finalHTML
      )
    ) {

      finalHTML =
        finalHTML.replace(
          /<head[^>]*>/i,
          match =>
            match +
            `<base href="${chapterPath}">`
        );

    } else {

      finalHTML =
        `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<base href="${chapterPath}">
</head>
<body>
${finalHTML}
</body>
</html>
`;

    }

    const blob =
      new Blob(
        [finalHTML],
        {
          type: "text/html"
        }
      );

    if (
      frame.dataset.blobUrl
    ) {

      try {

        URL.revokeObjectURL(
          frame.dataset.blobUrl
        );

      } catch (_) {}

    }

    const blobURL =
      URL.createObjectURL(
        blob
      );

    frame.dataset.blobUrl =
      blobURL;

    frame.onload =
      () => {

        loader.style.display =
          "none";

        try {
          frame.contentWindow.focus();
        } catch (_) {}

      };

    frame.src =
      blobURL;

  } catch (error) {

    console.error(
      "Chapter loading error:",
      error
    );

    /*
     * Fallback direto.
     */

    frame.onload =
      () => {

        loader.style.display =
          "none";

      };

    frame.src =
      chapterURL;

  }

}

/* =========================================================
   CHAPTER MENU
========================================================= */

const chapterRows =
  Array.from(
    document.querySelectorAll(
      ".menu .row[data-chapter]"
    )
  );

/*
 * IMPORTANTE:
 *
 * NÃO existe mais pointerenter -> playMove().
 *
 * Portanto o menu não toca snd_menumove.mp3.
 */

chapterRows.forEach(row => {

  row.addEventListener(
    "click",
    event => {

      event.preventDefault();

      if (gameStarted) {
        return;
      }

      const chapter =
        Number(
          row.dataset.chapter
        );

      if (
        Number.isFinite(chapter)
      ) {

        loadChapter(
          chapter
        );

      }

    }
  );

});

/* =========================================================
   MENU KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (gameStarted) {
      return;
    }

    if (
      event.key === "ArrowDown" ||
      event.key === "ArrowUp"
    ) {

      event.preventDefault();

      if (
        selectedIndex === null
      ) {

        selectedIndex = 0;

      } else if (
        event.key === "ArrowDown"
      ) {

        selectedIndex++;

        if (
          selectedIndex >=
          chapterRows.length
        ) {
          selectedIndex = 0;
        }

      } else {

        selectedIndex--;

        if (
          selectedIndex < 0
        ) {

          selectedIndex =
            chapterRows.length - 1;

        }

      }

      chapterRows.forEach(
        row =>
          row.classList.remove(
            "selected"
          )
      );

      const row =
        chapterRows[
          selectedIndex
        ];

      if (row) {

        row.classList.add(
          "selected"
        );

        row.scrollIntoView({
          block: "nearest"
        });

      }

    }

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      if (
        selectedIndex !== null
      ) {

        const row =
          chapterRows[
            selectedIndex
          ];

        if (row) {
          row.click();
        }

      }

    }

  }
);

/* =========================================================
   SAVE / IMPORT
========================================================= */

const DB_NAME =
  "_savedata";

const STORE_NAME =
  "FILE_DATA";

function getDB() {

  return new Promise(
    (resolve, reject) => {

      const request =
        indexedDB.open(
          DB_NAME,
          1
        );

      request.onupgradeneeded =
        event => {

          const db =
            event.target.result;

          if (
            !db.objectStoreNames
              .contains(
                STORE_NAME
              )
          ) {

            db.createObjectStore(
              STORE_NAME
            );

          }

        };

      request.onsuccess =
        event =>
          resolve(
            event.target.result
          );

      request.onerror =
        event =>
          reject(
            event.target.error
          );

    }
  );

}

async function getAllSaves() {

  const db =
    await getDB();

  return new Promise(
    (resolve, reject) => {

      const transaction =
        db.transaction(
          STORE_NAME,
          "readonly"
        );

      const store =
        transaction.objectStore(
          STORE_NAME
        );

      const request =
        store.openCursor();

      const data = {};

      request.onsuccess =
        event => {

          const cursor =
            event.target.result;

          if (!cursor) {

            resolve(data);

            return;

          }

          data[cursor.key] =
            cursor.value;

          cursor.continue();

        };

      request.onerror =
        event =>
          reject(
            event.target.error
          );

    }
  );

}

async function setSaveItem(
  key,
  content
) {

  const db =
    await getDB();

  return new Promise(
    (resolve, reject) => {

      const transaction =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );

      const bytes =
        new TextEncoder()
          .encode(content);

      transaction
        .objectStore(
          STORE_NAME
        )
        .put(
          {
            timestamp: new Date(),
            mode: 33206,
            contents: bytes
          },
          key
        );

      transaction.oncomplete =
        resolve;

      transaction.onerror =
        event =>
          reject(
            event.target.error
          );

    }
  );

}

/* =========================================================
   EXPORT
========================================================= */

document
  .getElementById(
    "export-row"
  )
  .addEventListener(
    "click",
    async event => {

      event.preventDefault();

      if (gameStarted) {
        return;
      }

      playSelect();

      try {

        const allData =
          await getAllSaves();

        const zip =
          new JSZip();

        let hasData = false;

        for (
          const key in allData
        ) {

          const value =
            allData[key];

          if (
            !(
              key.includes("filech") ||
              key.includes("dr_") ||
              key.includes("_savedata")
            )
          ) {
            continue;
          }

          let cleanKey =
            String(key)
              .replace(
                /^\/_savedata\//,
                ""
              )
              .replace(
                /^_savedata\//,
                ""
              );

          let text = "";

          if (
            value &&
            value.contents
          ) {

            let contents =
              value.contents;

            if (
              contents instanceof
              ArrayBuffer
            ) {

              contents =
                new Uint8Array(
                  contents
                );

            }

            text =
              new TextDecoder()
                .decode(
                  contents
                );

          } else if (
            typeof value ===
            "string"
          ) {

            text = value;

          }

          zip.file(
            cleanKey,
            text
          );

          hasData = true;

        }

        if (!hasData) {

          alert(
            "No save data found!"
          );

          return;

        }

        const blob =
          await zip.generateAsync({
            type: "blob"
          });

        const url =
          URL.createObjectURL(
            blob
          );

        const link =
          document.createElement(
            "a"
          );

        link.href = url;

        link.download =
          "deltarune_saves.zip";

        document.body.appendChild(
          link
        );

        link.click();

        link.remove();

        setTimeout(
          () =>
            URL.revokeObjectURL(
              url
            ),
          1000
        );

      } catch (error) {

        console.error(
          "Export error:",
          error
        );

        alert(
          "Failed to export saves."
        );

      }

    }
  );

/* =========================================================
   IMPORT
========================================================= */

document
  .getElementById(
    "import-row"
  )
  .addEventListener(
    "click",
    event => {

      event.preventDefault();

      if (gameStarted) {
        return;
      }

      playSelect();

      importFile.click();

    }
  );

importFile.addEventListener(
  "change",
  async () => {

    const file =
      importFile.files &&
      importFile.files[0];

    if (!file) {
      return;
    }

    try {

      const zip =
        await JSZip.loadAsync(
          file
        );

      const promises = [];

      zip.forEach(
        (path, entry) => {

          if (entry.dir) {
            return;
          }

          promises.push(
            entry
              .async("string")
              .then(
                content => {

                  let key =
                    entry.name
                      .replace(
                        /^\/+/,
                        ""
                      )
                      .replace(
                        /^_savedata\//,
                        ""
                      );

                  key =
                    "/_savedata/" +
                    key;

                  return setSaveItem(
                    key,
                    content
                  );

                }
              )
          );

        }
      );

      await Promise.all(
        promises
      );

      alert(
        "Saves imported successfully!"
      );

      location.reload();

    } catch (error) {

      console.error(
        "Import error:",
        error
      );

      alert(
        "Error importing save ZIP."
      );

    }

    importFile.value = "";

  }
);

/* =========================================================
   OLD DOMAIN
========================================================= */

function checkOldDomain() {

  if (
    location.hostname ===
    "deltarunefullwebport.vercel.app"
  ) {

    const notice =
      document.getElementById(
        "notice-container"
      );

    notice.innerHTML = `
      <div class="deactivation-warning">
        This domain might get deactivated soon.
        Please export your saves and switch to
        the new official domain:
        <br><br>
        <a
          href="https://byalvaro19.github.io/deltarune/"
          target="_blank"
          rel="noopener noreferrer"
        >
          byalvaro19.github.io/deltarune/
        </a>
      </div>
    `;

  }

}

/* =========================================================
   LOAD CONFIG
========================================================= */

function loadConfig() {

  try {

    const saved =
      localStorage.getItem(
        CONFIG_KEY
      );

    if (saved) {

      const parsed =
        JSON.parse(saved);

      if (
        parsed &&
        typeof parsed === "object"
      ) {

        if (
          typeof parsed.opacity ===
          "number"
        ) {
          config.opacity =
            parsed.opacity;
        }

        if (
          typeof parsed.scale ===
          "number"
        ) {
          config.scale =
            parsed.scale;
        }

      }

    }

  } catch (_) {}

}

/* =========================================================
   INITIALIZE
========================================================= */

function initialize() {

  checkOldDomain();

  try {

    mobileControls =
      localStorage.getItem(
        MOBILE_KEY
      ) === "true";

  } catch (_) {

    mobileControls = false;

  }

  loadConfig();

  document
    .getElementById(
      "opacity-slider"
    )
    .value =
    String(
      config.opacity
    );

  document
    .getElementById(
      "size-slider"
    )
    .value =
    String(
      config.scale
    );

  updateMobileText();

  applyConfig();

  updateHUD();

}
