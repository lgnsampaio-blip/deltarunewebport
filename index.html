<style>

@font-face {
  font-family: "Deltarune";
  src: url("https://cdn.jsdelivr.net/gh/ByAlvaro19/deltarune/font.otf")
       format("opentype");
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background: #000;
  color: #fff;
  overflow: hidden;
}

body {
  font-family: "Deltarune", monospace;
}

/* =========================================================
   MENU
========================================================= */

#main-menu-ui {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;
  height: 100dvh;

  overflow-y: auto;
  overflow-x: hidden;

  display: flex;
  flex-direction: column;
  align-items: center;

  padding:
    max(20px, env(safe-area-inset-top))
    20px
    100px;

  background: #000;

  z-index: 10;
}

#main-menu-ui::-webkit-scrollbar {
  display: none;
}

.logo-container {
  width: 100%;

  display: flex;
  justify-content: center;
  align-items: center;
}

.logo {
  width: min(700px, 90vw);
  height: auto;
  max-height: 200px;

  object-fit: contain;
  display: block;
}

/* =========================================================
   MENU
========================================================= */

.menu {
  width: min(90vw, 800px);

  margin: 20px auto 0;

  display: flex;
  flex-direction: column;
  align-items: stretch;
}

.row,
.disabled-row {
  width: 100%;

  display: grid;

  grid-template-columns:
    minmax(150px, 200px)
    minmax(0, 1fr)
    60px;

  align-items: center;

  padding: 12px 0;
  gap: 16px;

  color: #fff;
  text-decoration: none;

  touch-action: manipulation;
}

.row {
  cursor: pointer;
}

.disabled-row {
  opacity: .55;
}

.chapter,
.title,
.disabled-title {
  display: inline-block;

  transform: scaleY(1.1);
  transform-origin: bottom;
}

.chapter {
  text-align: left;
}

.title,
.disabled-title {
  text-align: center;
}

.row img,
.disabled-row img {
  width: 60px;
  height: 50px;

  object-fit: contain;

  image-rendering: pixelated;
}

.row:hover .chapter,
.row:hover .title,
.row.selected .chapter,
.row.selected .title {
  color: #fefe00;
}

.row:hover img,
.row.selected img {
  filter: sepia(1) saturate(100);
}

/* =========================================================
   WARNING
========================================================= */

.deactivation-warning {
  width: min(90vw, 700px);

  margin: 10px auto 20px;

  text-align: center;

  font-family: Arial, sans-serif;
  font-size: 15px;
  line-height: 1.4;
}

.deactivation-warning a {
  color: #ffff00;
}

/* =========================================================
   LOADER
========================================================= */

#loader-screen {
  position: fixed;
  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  background: #000;
  color: #fff;

  z-index: 100;

  font-family: Arial, sans-serif;
}

/* =========================================================
   GAME
========================================================= */

#game-frame {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100vh;
  height: 100dvh;

  border: 0;
  outline: 0;

  display: none;

  background: #000;

  z-index: 1;
}

/* =========================================================
   MOBILE HUD
========================================================= */

#hud-layer {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 20;

  display: none;

  pointer-events: none;

  opacity: var(--ctrl-opacity, 1);

  touch-action: none;
}

/* =========================================================
   PIXEL JOYSTICK
========================================================= */

#joystick {
  position: absolute;

  left: 65px;
  bottom: 75px;

  width: 150px;
  height: 150px;

  border-radius: 8px;

  pointer-events: auto;
  touch-action: none;

  transform: scale(var(--ctrl-scale, 1.15));
  transform-origin: center;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.08),
      rgba(255,255,255,.025)
    );

  border:
    3px solid rgba(255,255,255,.65);

  box-shadow:
    0 0 0 3px #000,
    0 0 0 5px rgba(255,255,255,.18),
    inset 0 0 0 3px rgba(0,0,0,.8),
    inset 0 0 25px rgba(255,255,255,.06);

  image-rendering: pixelated;
}

#joystick::before {
  content: "";

  position: absolute;
  inset: 12px;

  border: 2px dashed rgba(255,255,255,.18);

  pointer-events: none;
}

#joystick::after {
  content: "";

  position: absolute;

  left: 50%;
  top: 50%;

  width: 8px;
  height: 8px;

  margin-left: -4px;
  margin-top: -4px;

  background: rgba(255,255,255,.22);

  box-shadow:
    -18px 0 rgba(255,255,255,.10),
    18px 0 rgba(255,255,255,.10),
    0 -18px rgba(255,255,255,.10),
    0 18px rgba(255,255,255,.10);

  pointer-events: none;
}

#joystick-stick {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 70px;
  height: 70px;

  margin-left: -35px;
  margin-top: -35px;

  border-radius: 4px;

  background:
    linear-gradient(
      135deg,
      #fff,
      #bdbdbd
    );

  border:
    3px solid #000;

  box-shadow:
    0 0 0 2px #fff,
    5px 5px 0 rgba(0,0,0,.7);

  pointer-events: none;

  transition:
    transform .035s linear;
}

/* =========================================================
   Z X C BUTTONS
========================================================= */

#mobile-buttons {
  position: absolute;

  right: 50px;
  bottom: 55px;

  display: flex;
  flex-direction: column;

  gap: 14px;

  pointer-events: auto;
  touch-action: none;

  transform: scale(var(--ctrl-scale, 1.15));
  transform-origin: center;
}

.game-btn {
  position: relative;

  width: 66px;
  height: 66px;

  border-radius: 5px;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.20),
      rgba(255,255,255,.06)
    );

  border:
    3px solid #fff;

  color: #fff;

  font-family: Arial, sans-serif;
  font-size: 24px;
  font-weight: 900;

  text-shadow:
    2px 2px 0 #000;

  touch-action: none;
  pointer-events: auto;

  box-shadow:
    4px 4px 0 #000,
    0 0 0 2px rgba(255,255,255,.25);

  transition:
    transform .05s linear,
    background .05s linear;
}

.game-btn::before {
  content: "";

  position: absolute;
  inset: 5px;

  border:
    1px solid rgba(255,255,255,.25);

  pointer-events: none;
}

.game-btn.active {
  background: #fff;

  color: #000;

  text-shadow: none;

  transform:
    translate(3px, 3px)
    scale(.92);

  box-shadow:
    1px 1px 0 #000;
}

/* =========================================================
   MENU JOYSTICK
========================================================= */

#menu-joystick {
  position: fixed;

  left: 25px;
  bottom: 25px;

  width: 92px;
  height: 92px;

  display: none;

  z-index: 30;

  pointer-events: auto;
  touch-action: none;

  border:
    3px solid rgba(255,255,255,.55);

  border-radius: 6px;

  background:
    rgba(0,0,0,.8);

  box-shadow:
    0 0 0 2px #000,
    0 0 0 4px rgba(255,255,255,.15);
}

#menu-joystick-stick {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 42px;
  height: 42px;

  margin-left: -21px;
  margin-top: -21px;

  background: #fff;

  border:
    3px solid #000;

  border-radius: 4px;

  box-shadow:
    0 0 0 2px #fff;

  transition:
    transform .04s linear;
}

/* =========================================================
   SETTINGS
========================================================= */

#settings-bar {
  position: fixed;

  top:
    max(10px, env(safe-area-inset-top));

  right:
    max(10px, env(safe-area-inset-right));

  z-index: 50;

  display: none;

  gap: 5px;
}

#settings-toggle {
  padding: 9px 12px;

  color: #fff;

  background: rgba(20,20,20,.9);

  border:
    2px solid #fff;

  border-radius: 4px;

  font-family: Arial, sans-serif;
}

#settings-panel {
  position: fixed;

  top:
    max(
      60px,
      calc(env(safe-area-inset-top) + 50px)
    );

  right:
    max(
      10px,
      env(safe-area-inset-right)
    );

  width: 230px;

  padding: 18px;

  display: none;

  background: rgba(0,0,0,.96);

  border:
    2px solid #fff;

  border-radius: 4px;

  z-index: 49;

  font-family: Arial, sans-serif;
}

#settings-panel input {
  width: 100%;
}

#reset-pos {
  width: 100%;

  margin-top: 10px;

  padding: 10px;

  background: #222;

  color: #fff;

  border:
    2px solid #fff;

  border-radius: 3px;
}

/* =========================================================
   EDIT MODE
========================================================= */

body.edit-mode #joystick,
body.edit-mode #mobile-buttons {
  outline: 2px dashed #00bfff;

  background:
    rgba(0,191,255,.12);
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

  #main-menu-ui {
    padding-top:
      max(
        10px,
        env(safe-area-inset-top)
      );
  }

  .logo {
    width: 90vw;
    max-height: 150px;
  }

  .menu {
    width: 94vw;
  }

  .row,
  .disabled-row {
    grid-template-columns:
      110px
      minmax(0, 1fr)
      48px;

    gap: 8px;

    font-size: 22px;
  }

  .row img,
  .disabled-row img {
    width: 48px;
    height: 42px;
  }

  #joystick {
    left: 50px;
    bottom: 65px;
  }

  #mobile-buttons {
    right: 35px;
    bottom: 55px;
  }

  .game-btn {
    width: 62px;
    height: 62px;
  }
}

@media (max-width: 450px) {

  .row,
  .disabled-row {
    grid-template-columns:
      90px
      minmax(0,1fr)
      42px;

    font-size: 18px;
  }

  #joystick {
    left: 25px;
    bottom: 30px;

    width: 120px;
    height: 120px;
  }

  #joystick-stick {
    width: 56px;
    height: 56px;

    margin-left: -28px;
    margin-top: -28px;
  }

  #mobile-buttons {
    right: 20px;
    bottom: 25px;

    gap: 8px;
  }

  .game-btn {
    width: 55px;
    height: 55px;

    font-size: 21px;
  }

  #menu-joystick {
    left: 18px;
    bottom: 18px;
  }
}

</style>

<script>

"use strict";

/* =========================================================
   REPOSITORY
========================================================= */

const REPO_BASE =
  "https://cdn.jsdelivr.net/gh/ByAlvaro19/deltarune/";

/* =========================================================
   ELEMENTS
========================================================= */

const frame =
  document.getElementById("game-frame");

const hud =
  document.getElementById("hud-layer");

const menu =
  document.getElementById("main-menu-ui");

const loader =
  document.getElementById("loader-screen");

const joystick =
  document.getElementById("joystick");

const joystickStick =
  document.getElementById("joystick-stick");

const menuJoystick =
  document.getElementById("menu-joystick");

const menuJoystickStick =
  document.getElementById("menu-joystick-stick");

const mobileRow =
  document.getElementById("mobile-controls-row");

const mobileStatus =
  document.getElementById(
    "mobile-controls-status-text"
  );

const settingsBar =
  document.getElementById("settings-bar");

const settingsPanel =
  document.getElementById("settings-panel");

const importFile =
  document.getElementById("importFile");

/* =========================================================
   AUDIO
========================================================= */

const sndSelect =
  new Audio(
    REPO_BASE + "audios/snd_select.mp3"
  );

sndSelect.preload = "auto";

function playSelect() {

  try {

    sndSelect.currentTime = 0;

    const p = sndSelect.play();

    if (p) {
      p.catch(() => {});
    }

  } catch (_) {}

}

/* =========================================================
   STATE
========================================================= */

let gameStarted = false;

let mobileControls = false;

let selectedIndex = null;

let joystickPointer = null;

let menuJoystickPointer = null;

let menuRepeatTimer = null;

let menuRepeatDirection = null;

const activeKeys = new Set();

const MOBILE_KEY =
  "deltarune-mobile-toggle";

const CONFIG_KEY =
  "deltarune-mobile-config";

let config = {

  opacity: 1,

  scale: 1.15

};

/* =========================================================
   KEY MAP
========================================================= */

const keyMap = {

  ArrowUp: 38,
  ArrowDown: 40,
  ArrowLeft: 37,
  ArrowRight: 39,

  z: 90,
  x: 88,
  c: 67

};

/* =========================================================
   SEND INPUT TO GAME
========================================================= */

/*
 * O jogo fica dentro de um iframe.
 *
 * Portanto não basta usar postMessage sozinho:
 * o capítulo precisa receber a mensagem e transformar
 * isso em KeyboardEvent.
 *
 * O bridge abaixo é colocado no HTML do capítulo.
 */

function sendGameKey(type, key) {

  try {

    if (!frame.contentWindow) {
      return;
    }

    frame.contentWindow.postMessage(
      {
        type: type,
        key: key,
        keyCode: keyMap[key] || 0
      },
      "*"
    );

  } catch (_) {}

}

function updateKey(key, down) {

  if (!keyMap[key]) {
    return;
  }

  if (down) {

    if (activeKeys.has(key)) {
      return;
    }

    activeKeys.add(key);

    sendGameKey(
      "keydown",
      key
    );

  } else {

    if (!activeKeys.has(key)) {
      return;
    }

    activeKeys.delete(key);

    sendGameKey(
      "keyup",
      key
    );

  }

}

function releaseAllKeys() {

  for (
    const key of Array.from(activeKeys)
  ) {

    sendGameKey(
      "keyup",
      key
    );

    activeKeys.delete(key);

  }

}

/* =========================================================
   KEYBOARD BRIDGE
========================================================= */

function createInputBridge() {

  return `
<script>
(function() {

  if (window.__DELTARUNE_INPUT_BRIDGE__) {
    return;
  }

  window.__DELTARUNE_INPUT_BRIDGE__ = true;

  window.addEventListener(
    "message",
    function(event) {

      var data = event.data;

      if (!data || data.type !== "keydown" &&
          data.type !== "keyup") {
        return;
      }

      var type =
        data.type === "keydown"
          ? "keydown"
          : "keyup";

      var key =
        data.key || "";

      var code =
        data.keyCode || 0;

      try {

        var eventObject =
          new KeyboardEvent(
            type,
            {
              key: key,
              code:
                key === "ArrowUp"
                  ? "ArrowUp"
                  : key === "ArrowDown"
                    ? "ArrowDown"
                    : key === "ArrowLeft"
                      ? "ArrowLeft"
                      : key === "ArrowRight"
                        ? "ArrowRight"
                        : key.toUpperCase(),

              keyCode: code,
              which: code,

              bubbles: true,
              cancelable: true
            }
          );

        Object.defineProperty(
          eventObject,
          "keyCode",
          {
            get: function() {
              return code;
            }
          }
        );

        Object.defineProperty(
          eventObject,
          "which",
          {
            get: function() {
              return code;
            }
          }
        );

        document.dispatchEvent(
          eventObject
        );

        window.dispatchEvent(
          eventObject
        );

      } catch (_) {}

    }
  );

})();
<\/script>
`;

}

/* =========================================================
   MOBILE TOGGLE
========================================================= */

function updateMobileText() {

  mobileStatus.textContent =
    "Mobile controls: " +
    (
      mobileControls
        ? "ON"
        : "OFF"
    );

}

function toggleMobile() {

  playSelect();

  mobileControls =
    !mobileControls;

  try {

    localStorage.setItem(
      MOBILE_KEY,
      mobileControls
        ? "true"
        : "false"
    );

  } catch (_) {}

  updateMobileText();

  updateHUD();

}

function updateHUD() {

  if (
    gameStarted &&
    mobileControls
  ) {

    hud.style.display =
      "block";

    settingsBar.style.display =
      "flex";

    menuJoystick.style.display =
      "none";

  } else {

    hud.style.display =
      "none";

    settingsBar.style.display =
      "none";

    settingsPanel.style.display =
      "none";

    if (!gameStarted) {

      menuJoystick.style.display =
        mobileControls
          ? "block"
          : "none";

    }

    releaseAllKeys();

  }

}

/* =========================================================
   MENU SELECTION
========================================================= */

function moveMenuSelection(direction) {

  if (gameStarted) {
    return;
  }

  if (
    !chapterRows.length
  ) {
    return;
  }

  if (
    selectedIndex === null
  ) {

    selectedIndex =
      direction > 0
        ? 0
        : chapterRows.length - 1;

  } else {

    selectedIndex += direction;

    if (
      selectedIndex >=
      chapterRows.length
    ) {

      selectedIndex = 0;

    }

    if (
      selectedIndex < 0
    ) {

      selectedIndex =
        chapterRows.length - 1;

    }

  }

  chapterRows.forEach(
    row =>
      row.classList.remove(
        "selected"
      )
  );

  const row =
    chapterRows[selectedIndex];

  if (!row) {
    return;
  }

  row.classList.add(
    "selected"
  );

  row.scrollIntoView({
    block: "nearest"
  });

  playSelect();

}

/* =========================================================
   MENU JOYSTICK
========================================================= */

function stopMenuRepeat() {

  if (
    menuRepeatTimer !== null
  ) {

    clearInterval(
      menuRepeatTimer
    );

    menuRepeatTimer = null;

  }

  menuRepeatDirection =
    null;

  menuJoystickStick.style.transform =
    "translate(0px, 0px)";

}

function startMenuRepeat(direction) {

  if (
    menuRepeatDirection ===
    direction
  ) {
    return;
  }

  stopMenuRepeat();

  menuRepeatDirection =
    direction;

  moveMenuSelection(
    direction
  );

  /*
   * Segurando o joystick:
   * começa devagar e depois repete.
   */

  let delay = 420;

  setTimeout(
    () => {

      if (
        menuRepeatDirection !==
        direction
      ) {
        return;
      }

      menuRepeatTimer =
        setInterval(
          () => {

            if (
              menuRepeatDirection ===
              direction
            ) {

              moveMenuSelection(
                direction
              );

            }

          },
          115
        );

    },
    delay
  );

}

function menuJoystickMove(
  x,
  y
) {

  const rect =
    menuJoystick.getBoundingClientRect();

  const cx =
    rect.left +
    rect.width / 2;

  const cy =
    rect.top +
    rect.height / 2;

  let dx =
    x - cx;

  let dy =
    y - cy;

  const radius =
    rect.width * .30;

  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  if (
    distance > radius
  ) {

    const factor =
      radius / distance;

    dx *= factor;
    dy *= factor;

  }

  menuJoystickStick.style.transform =
    `translate(${dx}px, ${dy}px)`;

  const deadzone = 15;

  if (
    dy < -deadzone
  ) {

    startMenuRepeat(-1);

  } else if (
    dy > deadzone
  ) {

    startMenuRepeat(1);

  } else {

    stopMenuRepeat();

  }

}

menuJoystick.addEventListener(
  "pointerdown",
  event => {

    if (gameStarted) {
      return;
    }

    event.preventDefault();

    menuJoystickPointer =
      event.pointerId;

    try {

      menuJoystick.setPointerCapture(
        event.pointerId
      );

    } catch (_) {}

    menuJoystickMove(
      event.clientX,
      event.clientY
    );

  },
  {
    passive: false
  }
);

menuJoystick.addEventListener(
  "pointermove",
  event => {

    if (
      event.pointerId !==
      menuJoystickPointer
    ) {
      return;
    }

    event.preventDefault();

    menuJoystickMove(
      event.clientX,
      event.clientY
    );

  },
  {
    passive: false
  }
);

function releaseMenuJoystick(event) {

  if (
    menuJoystickPointer !== null &&
    event.pointerId !==
    menuJoystickPointer
  ) {
    return;
  }

  menuJoystickPointer =
    null;

  stopMenuRepeat();

}

menuJoystick.addEventListener(
  "pointerup",
  releaseMenuJoystick
);

menuJoystick.addEventListener(
  "pointercancel",
  releaseMenuJoystick
);

menuJoystick.addEventListener(
  "lostpointercapture",
  releaseMenuJoystick
);

/* =========================================================
   GAME JOYSTICK
========================================================= */

function resetJoystick() {

  joystickStick.style.transform =
    "translate(0px, 0px)";

}

function joystickMove(
  x,
  y
) {

  const rect =
    joystick.getBoundingClientRect();

  const cx =
    rect.left +
    rect.width / 2;

  const cy =
    rect.top +
    rect.height / 2;

  let dx =
    x - cx;

  let dy =
    y - cy;

  const radius =
    rect.width * .34;

  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  if (
    distance > radius
  ) {

    const factor =
      radius / distance;

    dx *= factor;
    dy *= factor;

  }

  joystickStick.style.transform =
    `translate(${dx}px, ${dy}px)`;

  const deadzone = 18;

  const keys = {

    ArrowUp:
      dy < -deadzone,

    ArrowDown:
      dy > deadzone,

    ArrowLeft:
      dx < -deadzone,

    ArrowRight:
      dx > deadzone

  };

  updateKey(
    "ArrowUp",
    keys.ArrowUp
  );

  updateKey(
    "ArrowDown",
    keys.ArrowDown
  );

  updateKey(
    "ArrowLeft",
    keys.ArrowLeft
  );

  updateKey(
    "ArrowRight",
    keys.ArrowRight
  );

}

joystick.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    joystickPointer =
      event.pointerId;

    try {

      joystick.setPointerCapture(
        event.pointerId
      );

    } catch (_) {}

    joystickMove(
      event.clientX,
      event.clientY
    );

  },
  {
    passive: false
  }
);

joystick.addEventListener(
  "pointermove",
  event => {

    if (
      event.pointerId !==
      joystickPointer
    ) {
      return;
    }

    event.preventDefault();

    joystickMove(
      event.clientX,
      event.clientY
    );

  },
  {
    passive: false
  }
);

function releaseJoystick(event) {

  if (
    joystickPointer !== null &&
    event.pointerId !==
    joystickPointer
  ) {
    return;
  }

  joystickPointer =
    null;

  resetJoystick();

  updateKey(
    "ArrowUp",
    false
  );

  updateKey(
    "ArrowDown",
    false
  );

  updateKey(
    "ArrowLeft",
    false
  );

  updateKey(
    "ArrowRight",
    false
  );

}

joystick.addEventListener(
  "pointerup",
  releaseJoystick
);

joystick.addEventListener(
  "pointercancel",
  releaseJoystick
);

joystick.addEventListener(
  "lostpointercapture",
  releaseJoystick
);

document

          event.pointerId;

          button.setPointerCapture(
            pointerId
          );

        } catch (_) {}

        updateKey(
          key,
          true
        );

        button.classList.add(
          "active"
        );

      },
      {
        passive: false
      }
    );

      if (
        pointerId !== null &&

      event.preventDefault();

      updateKey(
        key,
        false
      );

      button.classList.remove(

    button.addEventListener(

        passive: false
      }

    button.addEventListener(
      "pointercancel",
      release,
      {
        passive: false
      }
    );

    button.addEventListener(
      "lostpointercapture",
      () => {

        updateKey(
          key,
          false
        );

        button.classList.remove(

        );

/* =========================================================
   LOAD CHAPTER
========================================================= */

async function loadChapter(chapter) {

  playSelect();

  gameStarted = true;

  releaseAllKeys();

  stopMenuRepeat();

  menu.style.display =
    "none";

  menuJoystick.style.display =
    "none";

  loader.style.display =
    "flex";

  frame.style.display =
    "block";

  updateHUD();

  const chapterPath =
    `${REPO_BASE}chapter${chapter}/`;

  const chapterURL =
    `${chapterPath}index.html`;

  try {

    const response =
      await fetch(
        chapterURL,
        {
          cache: "no-cache"
        }
      );

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    const html =
      await response.text();

    if (!html.trim()) {

      throw new Error(
        "Empty chapter"
      );

    }

    /*
     * Remove <base> antigo.
     */

    let finalHTML =
      html.replace(
        /<base\b[^>]*>/gi,
        ""
      );

    /*
     * Adiciona base correta.
     */

    const baseTag =
      `<base href="${chapterPath}">`;

    /*
     * Adiciona o bridge de controles
     * dentro do capítulo.
     */

    const inputBridge =
      createInputBridge();

    if (
      /<head[^>]*>/i.test(
        finalHTML
      )
    ) {

      finalHTML =
        finalHTML.replace(
          /<head[^>]*>/i,
          match =>
            match +
            baseTag +
            inputBridge
        );

    } else {

      finalHTML =
`
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
${baseTag}
${inputBridge}
</head>
<body>
${finalHTML}
</body>
</html>
`;

    }

    /*
     * Cria Blob.
     */

    const blob =
      new Blob(
        [finalHTML],
        {
          type: "text/html"
        }
      );

    /*
     * Libera Blob antigo.
     */

    if (
      frame.dataset.blobUrl
    ) {

      try {

        URL.revokeObjectURL(
          frame.dataset.blobUrl
        );

      } catch (_) {}

    }

    const blobURL =
      URL.createObjectURL(
        blob
      );

    frame.dataset.blobUrl =
      blobURL;

    frame.onload =
      () => {

        loader.style.display =
          "none";

        updateHUD();

        try {

          frame.contentWindow.focus();

        } catch (_) {}

      };

    frame.onerror =
      () => {

        loader.style.display =
          "none";

        console.error(
          "Failed to load chapter iframe."
        );

      };

    frame.src =
      blobURL;

  } catch (error) {

    console.error(
      "Chapter loading error:",
      error
    );

    /*
     * Fallback direto.
     */

    frame.onload =
      () => {

        loader.style.display =
          "none";

        updateHUD();

      };

    frame.src =
      chapterURL;

  }

}

/* =========================================================
   SAVE DATABASE
========================================================= */

const DB_NAME =
  "_savedata";

const STORE_NAME =
  "FILE_DATA";

function getDB() {

  return new Promise(
    (resolve, reject) => {

      const request =
        indexedDB.open(
          DB_NAME,
          1
        );

      request.onupgradeneeded =
        event => {

          const db =
            event.target.result;

          if (
            !db.objectStoreNames
              .contains(
                STORE_NAME
              )
          ) {

            db.createObjectStore(
              STORE_NAME
            );

          }

        };

      request.onsuccess =
        event =>
          resolve(
            event.target.result
          );

      request.onerror =
        event =>
          reject(
            event.target.error
          );

    }
  );

}

async function getAllSaves() {

  const db =
    await getDB();

  return new Promise(
    (resolve, reject) => {

      const transaction =
        db.transaction(
          STORE_NAME,
          "readonly"
        );

      const store =
        transaction.objectStore(
          STORE_NAME
        );

      const request =
        store.openCursor();

      const data = {};

      request.onsuccess =
        event => {

          const cursor =
            event.target.result;

          if (!cursor) {

            resolve(data);

            return;

          }

          data[cursor.key] =
            cursor.value;

          cursor.continue();

        };

      request.onerror =
        event =>
          reject(
            event.target.error
          );

    }
  );

}

async function setSaveItem(
  key,
  content
) {

  const db =
    await getDB();

  return new Promise(
    (resolve, reject) => {

      const transaction =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );

      const bytes =
        new TextEncoder()
          .encode(content);

      transaction
        .objectStore(
          STORE_NAME
        )
        .put(
          {
            timestamp:
              new Date(),

            mode:
              33206,

            contents:
              bytes

          },
          key
        );

      transaction.oncomplete =
        resolve;

      transaction.onerror =
        event =>
          reject(
            event.target.error
          );

    }
  );

}

/* =========================================================
   EXPORT
========================================================= */

document
  .getElementById(
    "export-row"
  )
  .addEventListener(
    "click",
    async event => {

      event.preventDefault();

      if (gameStarted) {
        return;
      }

      playSelect();

      try {

        const allData =
          await getAllSaves();

        const zip =
          new JSZip();

        let hasData = false;

        for (
          const key in allData
        ) {

          const value =
            allData[key];

          if (
            !(
              key.includes("filech") ||
              key.includes("dr_") ||
              key.includes("_savedata")
            )
          ) {
            continue;
          }

          let cleanKey =
            String(key)
              .replace(
                /^\/_savedata\//,
                ""
              )
              .replace(
                /^_savedata\//,
                ""
              );

          let text = "";

          if (
            value &&
            value.contents
          ) {

            let contents =
              value.contents;

            if (
              contents instanceof
              ArrayBuffer
            ) {

              contents =
                new Uint8Array(
                  contents
                );

            }

            text =
              new TextDecoder()
                .decode(
                  contents
                );

          } else if (
            typeof value ===
            "string"
          ) {

            text = value;

          }

          zip.file(
            cleanKey,
            text
          );

          hasData = true;

        }

        if (!hasData) {

          alert(
            "No save data found!"
          );

          return;

        }

        const blob =
          await zip.generateAsync({
            type: "blob"
          });

        const url =
          URL.createObjectURL(
            blob
          );

        const link =
          document.createElement(
            "a"
          );

        link.href =
          url;

        link.download =
          "deltarune_saves.zip";

        document.body.appendChild(
          link
        );

        link.click();

        link.remove();

        setTimeout(
          () =>
            URL.revokeObjectURL(
              url
            ),
          1000
        );

      } catch (error) {

        console.error(
          "Export error:",
          error
        );

        alert(
          "Failed to export saves."
        );

      }

    }
  );

/* =========================================================
   IMPORT
========================================================= */

document
  .getElementById(
    "import-row"
  )
  .addEventListener(
    "click",
    event => {

      event.preventDefault();

      if (gameStarted) {
        return;
      }

      playSelect();

      importFile.click();

    }
  );

importFile.addEventListener(
  "change",
  async () => {

    const file =
      importFile.files &&
      importFile.files[0];

    if (!file) {
      return;
    }

    try {

      const zip =
        await JSZip.loadAsync(
          file
        );

      const promises = [];

      zip.forEach(
        (path, entry) => {

          if (entry.dir) {
            return;
          }

          promises.push(
            entry
              .async("string")
              .then(
                content => {

                  let key =
                    entry.name
                      .replace(
                        /^\/+/,
                        ""
                      )
                      .replace(
                        /^_savedata\//,
                        ""
                      );

                  key =
                    "/_savedata/" +
                    key;

                  return setSaveItem(
                    key,
                    content
                  );

                }
              )
          );

        }
      );

      await Promise.all(
        promises
      );

      alert(
        "Saves imported successfully!"
      );

      location.reload();

    } catch (error) {

      console.error(
        "Import error:",
        error
      );

      alert(
        "Error importing save ZIP."
      );

    }

    importFile.value = "";

  }
);

function loadConfig() {

        JSON.parse(saved);

      if (
        parsed &&
        typeof parsed === "object"

        if (

        ) {

          config.opacity =

        }

        if (
          typeof parsed.scale ===
          "number"
        ) {

          config.scale =
            parsed.scale;

        }

      }

    }

  } catch (_) {}

}
