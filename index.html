  <style>

    :root {
      --ctrl-scale: 1.3;
      --ctrl-opacity: 1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      background: #000;

      overflow: hidden;

      overscroll-behavior: none;

      touch-action: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    button,
    input,
    a {
      font: inherit;
    }

    /* =====================================================
       MENU
    ====================================================== */

    #main-menu-ui {

      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;
      height: 100dvh;

      z-index: 5;

      overflow-x: hidden;
      overflow-y: auto;

      -webkit-overflow-scrolling: touch;

      overscroll-behavior-y: contain;

      touch-action: pan-y;

      padding-bottom: 120px;
    }

    #main-menu-ui .logo-container,
    #main-menu-ui .menu,
    #main-menu-ui #notice-container {
      touch-action: pan-y;
    }

    #main-menu-ui .row,
    #main-menu-ui .disabled-row {
      touch-action: manipulation;
    }

    #main-menu-ui::-webkit-scrollbar {
      display: none;
    }

    /* =====================================================
       WARNING
    ====================================================== */

    .deactivation-warning {

      width: 90%;
      max-width: 700px;

      margin: 20px auto;

      color: #fff;

      text-align: center;

      font-family: Arial, sans-serif;

      font-weight: bold;

      line-height: 1.4;
    }

    .deactivation-warning a {

      color: #ffff00;

      text-decoration: underline;

      -webkit-user-select: text;
      user-select: text;
    }

    /* =====================================================
       GAME FRAME
    ====================================================== */

    #game-frame {

      position: fixed;
      inset: 0;

      width: 100vw;

      height: 100vh;
      height: 100dvh;

      border: 0;
      outline: 0;

      display: none;

      background: #000;

      z-index: 1;
    }

    /* =====================================================
       LOADER
    ====================================================== */

    #loader-screen {

      position: fixed;
      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      background: #000;

      color: #fff;

      z-index: 100;

      font-family: Arial, sans-serif;

      font-size: 18px;
    }

    /* =====================================================
       HUD
    ====================================================== */

    #hud-layer {

      position: fixed;
      inset: 0;

      width: 100vw;

      height: 100vh;
      height: 100dvh;

      z-index: 10;

      display: none;

      pointer-events: none;

      opacity: var(--ctrl-opacity);

      touch-action: none;
    }

    .touch-group {

      position: absolute;

      pointer-events: auto;

      touch-action: none;

      transform:
        translate(-50%, -50%)
        scale(var(--ctrl-scale));

      transform-origin: center center;

      cursor: grab;

      -webkit-user-select: none;
      user-select: none;
    }

    .touch-group:active {
      cursor: grabbing;
    }

    /* =====================================================
       EDIT MODE
    ====================================================== */

    body.edit-mode .touch-group {

      border: 2px dashed #00bfff !important;

      background: rgba(
        0,
        191,
        255,
        0.18
      ) !important;

      opacity: 1 !important;
    }

    body.edit-mode #hud-layer {
      pointer-events: auto;
    }

    /* =====================================================
       D-PAD
    ====================================================== */

    #dpad-group {

      left: 20%;
      top: 75%;

      width: 180px;
      height: 180px;
    }

    .dpad-container {

      position: relative;

      width: 100%;
      height: 100%;

      touch-action: none;

      pointer-events: auto;
    }

    .dpad-btn {

      position: absolute;

      width: 55px;
      height: 55px;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        rgba(
          255,
          255,
          255,
          0.15
        );

      border:
        2px solid
        rgba(
          255,
          255,
          255,
          0.3
        );

      border-radius: 8px;

      color: #fff;

      font-family: Arial, sans-serif;

      font-size: 22px;

      pointer-events: none;
    }

    #up {

      top: 0;
      left: 50%;

      transform:
        translateX(-50%);
    }

    #down {

      bottom: 0;
      left: 50%;

      transform:
        translateX(-50%);
    }

    #left {

      left: 0;
      top: 50%;

      transform:
        translateY(-50%);
    }

    #right {

      right: 0;
      top: 50%;

      transform:
        translateY(-50%);
    }

    /* =====================================================
       Z X C
    ====================================================== */

    #btn-z {

      left: 70%;
      top: 85%;
    }

    #btn-x {

      left: 80%;
      top: 75%;
    }

    #btn-c {

      left: 90%;
      top: 65%;
    }

    .btn {

      width: 65px;
      height: 65px;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        rgba(
          255,
          255,
          255,
          0.2
        );

      border:
        2px solid
        rgba(
          255,
          255,
          255,
          0.4
        );

      border-radius: 50%;

      color: #fff;

      font-family: Arial, sans-serif;

      font-size: 1.4rem;

      font-weight: bold;

      pointer-events: auto;

      touch-action: none;

      -webkit-user-select: none;
      user-select: none;
    }

    .btn.active {

      background:
        rgba(
          255,
          255,
          255,
          0.6
        );

      border-color: #fff;
    }

    /* =====================================================
       SETTINGS BUTTON
    ====================================================== */

    #settings-bar {

      position: fixed;

      top:
        max(
          10px,
          env(safe-area-inset-top)
        );

      right:
        max(
          10px,
          env(safe-area-inset-right)
        );

      z-index: 50;

      display: none;

      gap: 5px;

      pointer-events: auto;
    }

    #settings-bar button {

      padding: 10px 12px;

      background:
        rgba(
          30,
          30,
          30,
          0.9
        );

      color: #fff;

      border:
        1px solid #777;

      border-radius: 8px;

      font-family: Arial, sans-serif;

      touch-action: manipulation;
    }

    /* =====================================================
       SETTINGS PANEL
    ====================================================== */

    #settings-panel {

      position: fixed;

      top:

      right:

        );

      z-index: 49;

      width: 230px;

      max-width:

      font-family: Arial, sans-serif;

    #settings-panel input[type="range"] {

      background: #444;

      border-radius: 3px;

    #settings-panel

      appearance: none;

      -webkit-appearance: none;

      width: 18px;
      height: 18px;

      background: #00bfff;

      border-radius: 50%;
    }

    @media (max-width: 600px) {

      #main-menu-ui {
        padding-bottom: 140px;
      }

      #settings-panel {
        width: 210px;
      }
    }

  <script>
    "use strict";

    /* =====================================================
       REPOSITORY
    ====================================================== */

    const REPO_BASE =
      "https://cdn.jsdelivr.net/gh/ByAlvaro19/deltarune/";

    /* =====================================================
       ELEMENTS
    ====================================================== */

    const frame =
      document.getElementById("game-frame");

    const hud =
      document.getElementById("hud-layer");

    const mainMenu =
      document.getElementById("main-menu-ui");

    const loader =
      document.getElementById("loader-screen");

    const settingsBar =
      document.getElementById("settings-bar");

    const settingsPanel =
      document.getElementById("settings-panel");

    const dpadZone =
      document.getElementById("dpad-touch-zone");

    const mobileRow =
      document.getElementById(
        "mobile-controls-row"
      );

    const mobileStatus =
      document.getElementById(
        "mobile-controls-status-text"
      );

    const importInput =
      document.getElementById(
        "importFile"
      );

    /* =====================================================
       AUDIO
    ====================================================== */

    const sndMenuMove =
      new Audio(
        REPO_BASE +
        "audios/snd_menumove.mp3"
      );

    const sndSelect =
      new Audio(
        REPO_BASE +
        "audios/snd_select.mp3"
      );

    sndMenuMove.preload = "auto";
    sndSelect.preload = "auto";

    function playMove() {

      try {

        sndMenuMove.currentTime = 0;

        const promise =
          sndMenuMove.play();

        if (promise) {
          promise.catch(() => {});
        }

      } catch (_) {}
    }

    function playSelect() {

      try {

        sndSelect.currentTime = 0;

        const promise =
          sndSelect.play();

        if (promise) {
          promise.catch(() => {});
        }

      } catch (_) {}
    }

    /* =====================================================
       STATE
    ====================================================== */

    let gameStarted = false;

    let useMobileControls = false;

    let isEditing = false;

    let selectedIndex = null;

    let activeDragItem = null;

    let dragPointerId = null;

    let dpadPointerId = null;

    const STORAGE_KEY =
      "deltarune-v18-controls";

    const MOBILE_KEY =
      "deltarune-mobile-toggle";

    let config = {

      opacity: 1,

      scale: 1.3,

      positions: {}

    };

    /* =====================================================
       KEY MAP
    ====================================================== */

    const keyMap = {

      ArrowUp: 38,

      ArrowDown: 40,

      ArrowLeft: 37,

      ArrowRight: 39,

      z: 90,

      x: 88,

      c: 67

    };

    const activeKeys =
      new Set();

    /* =====================================================
       SEND KEY TO GAME
    ====================================================== */

    function sendGameKey(
      type,
      key
    ) {

      if (
        !frame.contentWindow
      ) {
        return;
      }

      try {

        frame.contentWindow.postMessage(
          {
            type: type,
            key: key,
            keyCode:
              keyMap[key] || 0
          },
          "*"
        );

      } catch (error) {

        console.error(
          "Input error:",
          error
        );
      }
    }

    function updateKey(
      key,
      isDown
    ) {

      if (isEditing) {
        return;
      }

      if (!keyMap[key]) {
        return;
      }

      if (isDown) {

        if (
          activeKeys.has(key)
        ) {
          return;
        }

        activeKeys.add(key);

        sendGameKey(
          "keydown",
          key
        );

      } else {

        if (
          !activeKeys.has(key)
        ) {
          return;
        }

        activeKeys.delete(key);

        sendGameKey(
          "keyup",
          key
        );
      }
    }

    function releaseAllKeys() {

      for (
        const key of
        Array.from(activeKeys)
      ) {

        sendGameKey(
          "keyup",
          key
        );

        activeKeys.delete(key);
      }
    }

    /* =====================================================
       INDEXED DB
    ====================================================== */

    const DB_NAME =
      "_savedata";

    const STORE_NAME =
      "FILE_DATA";

    function getDB() {

      return new Promise(
        (resolve, reject) => {

          const request =
            indexedDB.open(
              DB_NAME,
              1
            );

          request.onupgradeneeded =
            event => {

              const db =
                event.target.result;

              if (
                !db.objectStoreNames
                  .contains(
                    STORE_NAME
                  )
              ) {

                db.createObjectStore(
                  STORE_NAME
                );
              }
            };

          request.onsuccess =
            event => {

              resolve(
                event.target.result
              );
            };

          request.onerror =
            event => {

              reject(
                event.target.error
              );
            };

        }
      );
    }

    async function getAllSaves() {

      const db =
        await getDB();

      return new Promise(
        (resolve, reject) => {

          const transaction =
            db.transaction(
              STORE_NAME,
              "readonly"
            );

          const store =
            transaction.objectStore(
              STORE_NAME
            );

          const request =
            store.openCursor();

          const data = {};

          request.onsuccess =
            event => {

              const cursor =
                event.target.result;

              if (!cursor) {

                resolve(data);

                return;
              }

              data[cursor.key] =
                cursor.value;

              cursor.continue();
            };

          request.onerror =
            event => {

              reject(
                event.target.error
              );
            };

        }
      );
    }

    async function setSaveItem(
      key,
      content
    ) {

      const db =
        await getDB();

      return new Promise(
        (resolve, reject) => {

          const transaction =
            db.transaction(
              STORE_NAME,
              "readwrite"
            );

          const bytes =
            new TextEncoder()
              .encode(content);

          const fileObject = {

            timestamp:
              new Date(),

            mode: 33206,

            contents:
              bytes
          };

          transaction
            .objectStore(
              STORE_NAME
            )
            .put(
              fileObject,
              key
            );

          transaction.oncomplete =
            () => resolve();

          transaction.onerror =
            event => {

              reject(
                event.target.error
              );
            };

        }
      );
    }

    /* =====================================================
       EXPORT SAVE
    ====================================================== */

    async function exportSave() {

      playSelect();

      try {

        if (
          typeof JSZip ===
          "undefined"
        ) {

          alert(
            "JSZip could not be loaded."
          );

          return;
        }

        const allData =
          await getAllSaves();

        const zip =
          new JSZip();

        let hasData = false;

        for (
          const key in allData
        ) {

          const value =
            allData[key];

          if (
            key.includes("filech") ||
            key.includes("dr_") ||
            key.includes("_savedata")
          ) {

            let cleanKey =
              String(key)
                .replace(
                  /^\/_savedata\//,
                  ""
                )
                .replace(
                  /^_savedata\//,
                  ""
                );

            let text = "";

            if (
              value &&
              value.contents
            ) {

              let contents =
                value.contents;

              if (
                contents instanceof
                ArrayBuffer
              ) {

                contents =
                  new Uint8Array(
                    contents
                  );
              }

              text =
                new TextDecoder()
                  .decode(
                    contents
                  );

            } else if (
              typeof value ===
              "string"
            ) {

              text = value;
            }

            zip.file(
              cleanKey,
              text
            );

            hasData = true;
          }
        }

        if (!hasData) {

          alert(
            "No save data found in the engine database!"
          );

          return;
        }

        const blob =
          await zip.generateAsync(
            {
              type: "blob"
            }
          );

        const url =
          URL.createObjectURL(
            blob
          );

        const link =
          document.createElement(
            "a"
          );

        link.href = url;

        link.download =
          "deltarune_saves.zip";

        link.style.display =
          "none";

        document.body.appendChild(
          link
        );

        link.click();

        link.remove();

        setTimeout(
          () => {
            URL.revokeObjectURL(
              url
            );
          },
          1000
        );

      } catch (error) {

        console.error(
          "Export error:",
          error
        );

        alert(
          "Failed to export saves."
        );
      }
    }

    /* =====================================================
       IMPORT SAVE
    ====================================================== */

    async function importSave(
      input
    ) {

      playSelect();

      const file =
        input.files &&
        input.files[0];

      if (!file) {
        return;
      }

      try {

        if (
          typeof JSZip ===
          "undefined"
        ) {

          alert(
            "JSZip could not be loaded."
          );

          return;
        }

        const zip =
          await JSZip.loadAsync(
            file
          );

        const promises = [];

        zip.forEach(
          (path, entry) => {

            if (entry.dir) {
              return;
            }

            const promise =
              entry
                .async("string")
                .then(
                  content => {

                    let key =
                      entry.name;

                    key =
                      key.replace(
                        /^\/+/,
                        ""
                      );

                    key =
                      key.replace(
                        /^_savedata\//,
                        ""
                      );

                    key =
                      "/_savedata/" +
                      key;

                    return setSaveItem(
                      key,
                      content
                    );
                  }
                );

            promises.push(
              promise
            );
          }
        );

        if (
          promises.length === 0
        ) {

          throw new Error(
            "Zip file is empty."
          );
        }

        await Promise.all(
          promises
        );

        alert(
          "Saves imported successfully! Reloading..."
        );

        window.location.reload();

      } catch (error) {

        console.error(
          "Import error:",
          error
        );

        alert(
          "Error importing zip file."
        );

      } finally {

        input.value = "";
      }
    }

    /* =====================================================
       D-PAD
    ====================================================== */

    function processDpad(
      x,
      y
    ) {

      if (isEditing) {
        return;
      }

      const rect =
        dpadZone.getBoundingClientRect();

      const centerX =
        rect.left +
        rect.width / 2;

      const centerY =
        rect.top +
        rect.height / 2;

      const dx =
        x - centerX;

      const dy =
        y - centerY;

      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );

      const keys =
        new Set();

      if (distance > 15) {

        const angle =
          Math.atan2(
            dy,
            dx
          ) *
          180 /
          Math.PI;

        const diagonal = 25;

        if (
          angle >=
            -90 - diagonal &&
          angle <=
            -90 + diagonal
        ) {

          keys.add(
            "ArrowUp"
          );

        } else if (
          angle >=
            90 - diagonal &&
          angle <=
            90 + diagonal
        ) {

          keys.add(
            "ArrowDown"
          );

        } else if (
          angle >=
            180 - diagonal ||
          angle <=
            -180 + diagonal
        ) {

          keys.add(
            "ArrowLeft"
          );

        } else if (
          angle >=
            -diagonal &&
          angle <=
            diagonal
        ) {

          keys.add(
            "ArrowRight"
          );

        } else {

          if (dy < 0) {
            keys.add(
              "ArrowUp"
            );
          }

          if (dy > 0) {
            keys.add(
              "ArrowDown"
            );
          }

          if (dx < 0) {
            keys.add(
              "ArrowLeft"
            );
          }

          if (dx > 0) {
            keys.add(
              "ArrowRight"
            );
          }
        }
      }

      const directions = [

        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight"

      ];

      for (
        const key of directions
      ) {

        updateKey(
          key,
          keys.has(key)
        );
      }
    }

    function releaseDpad() {

      dpadPointerId =
        null;

      updateKey(
        "ArrowUp",
        false
      );

      updateKey(
        "ArrowDown",
        false
      );

      updateKey(
        "ArrowLeft",
        false
      );

      updateKey(
        "ArrowRight",
        false
      );
    }

    /* =====================================================
       D-PAD EVENTS
    ====================================================== */

    dpadZone.addEventListener(
      "pointerdown",
      event => {

        if (isEditing) {
          return;
        }

        event.preventDefault();

        dpadPointerId =
          event.pointerId;

        try {

          dpadZone.setPointerCapture(
            event.pointerId
          );

        } catch (_) {}

        processDpad(
          event.clientX,
          event.clientY
        );

      },
      {
        passive: false
      }
    );

    dpadZone.addEventListener(
      "pointermove",
      event => {

        if (
          dpadPointerId !==
          event.pointerId
        ) {
          return;
        }

        event.preventDefault();

        processDpad(
          event.clientX,
          event.clientY
        );

      },
      {
        passive: false
      }
    );

    dpadZone.addEventListener(
      "pointerup",
      event => {

        if (
          dpadPointerId !==
          event.pointerId
        ) {
          return;
        }

        event.preventDefault();

        releaseDpad();

      },
      {
        passive: false
      }
    );

    dpadZone.addEventListener(
      "pointercancel",
      releaseDpad,
      {
        passive: false
      }
    );

    dpadZone.addEventListener(
      "lostpointercapture",
      releaseDpad
    );

            button.classList.add(

          },

        );

        const release =

            if (
              pointerId !== null &&

            ) {
              return;
            }

            event.preventDefault();

            updateKey(
              key,
              false
            );

            button.classList.remove(
              "active"
            );

            pointerId = null;
          };

        button.addEventListener(
          "pointerup",
          release,
          {
            passive: false
          }
        );

        button.addEventListener(
          "pointercancel",
          release,
          {
            passive: false
          }
        );

        button.addEventListener(

    /* =====================================================
       DRAG CONTROLS
    ====================================================== */

    document
      .querySelectorAll(
        ".draggable"
      )
      .forEach(element => {

        element.addEventListener(
          "pointerdown",
          event => {

            if (!isEditing) {
              return;
            }

            event.preventDefault();

            event.stopPropagation();

            activeDragItem =
              element;

            dragPointerId =
              event.pointerId;

            try {

              element.setPointerCapture(
                event.pointerId
              );

            } catch (_) {}

            element.style.cursor =
              "grabbing";
          },
          {
            passive: false
          }
        );

        element.addEventListener(
          "pointermove",
          event => {

            if (
              !activeDragItem ||
              activeDragItem !==
                element ||
              dragPointerId !==
                event.pointerId
            ) {
              return;
            }

            event.preventDefault();

            const x =
              Math.max(
                0,
                Math.min(
                  window.innerWidth,
                  event.clientX
                )
              );

            const y =
              Math.max(
                0,
                Math.min(
                  window.innerHeight,
                  event.clientY
                )
              );

            element.style.left =
              (
                x /
                window.innerWidth *
                100
              ).toFixed(2) +
              "%";

            element.style.top =
              (
                y /
                window.innerHeight *
                100
              ).toFixed(2) +
              "%";
          },
          {
            passive: false
          }
        );

        const stopDrag =
          event => {

            if (
              activeDragItem !==
              element
            ) {
              return;
            }

            if (
              dragPointerId !== null &&
              event.pointerId !==
                dragPointerId
            ) {
              return;
            }

            element.style.cursor =
              "grab";

            activeDragItem = null;

            dragPointerId = null;
          };

        element.addEventListener(
          "pointerup",
          stopDrag,
          {
            passive: false
          }
        );

        element.addEventListener(
          "pointercancel",
          stopDrag,
          {
            passive: false
          }
        );

        element.addEventListener(
          "lostpointercapture",
          stopDrag
        );
      });

        .forEach(element => {

              element.style.top ||

          };

    /* =====================================================
       CONFIG
    ====================================================== */

    function saveConfig() {

      try {

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(config)
        );

      } catch (error) {

        console.error(
          "Config save error:",
          error
        );
      }
    }

    function loadConfig() {

      try {

        const saved =
          localStorage.getItem(
            STORAGE_KEY
          );

        if (!saved) {
          return;
        }

        const parsed =
          JSON.parse(saved);

        if (
          parsed &&
          typeof parsed ===
            "object"
        ) {

          config = {

            opacity:
              typeof parsed.opacity ===
                "number"
                ? parsed.opacity
                : 1,

            scale:
              typeof parsed.scale ===
                "number"
                ? parsed.scale
                : 1.3,

            positions:
              parsed.positions &&
              typeof parsed.positions ===
                "object"
                ? parsed.positions
                : {}
          };
        }

      } catch (error) {

        console.error(
          "Config load error:",
          error
        );

        config = {

          opacity: 1,

          scale: 1.3,

          positions: {}
        };
      }
    }

    function applyConfig() {

      document.documentElement
        .style.setProperty(
          "--ctrl-scale",
          String(
            config.scale
          )
        );

      document.documentElement
        .style.setProperty(
          "--ctrl-opacity",
          String(
            config.opacity
          )
        );

      Object.entries(
        config.positions || {}
      ).forEach(
        ([id, position]) => {

          const element =
            document.querySelector(
              `[data-save-id="${id}"]`
            );

          if (
            !element ||
            !position
          ) {
            return;
          }

          if (
            typeof position.x ===
              "string" &&
            position.x !== ""
          ) {

            element.style.left =
              position.x;
          }

          if (
            typeof position.y ===
              "string" &&
            position.y !== ""
          ) {

            element.style.top =
              position.y;
          }
        }
      );

      if (
        gameStarted &&
        useMobileControls
      ) {

        hud.style.display =
          "block";

        settingsBar.style.display =
          "flex";

      } else {

        hud.style.display =
          "none";

        settingsBar.style.display =
          "none";

        settingsPanel.style.display =
          "none";

        isEditing = false;

        document.body.classList
          .remove(
            "edit-mode"
          );
      }
    }

    /* =====================================================
       GAME HTML LOADER
    ====================================================== */

    function injectAndLoad(
      htmlText,
      baseURL
    ) {

      let finalHTML =
        String(htmlText);

      /*
        Remove an existing base.
        This prevents duplicate <base>
        elements from breaking paths.
      */

      finalHTML =
        finalHTML.replace(
          /<base\b[^>]*>/gi,
          ""
        );

      const receiver = `
<script>
(function () {

  "use strict";

  function resizeGame() {

    try {

      window.dispatchEvent(
        new Event("resize")
      );

    } catch (_) {}

    try {

      const canvas =
        document.querySelector(
          "canvas"
        );

      if (canvas) {

        canvas.style.maxWidth =
          "100vw";

        canvas.style.maxHeight =
          "100vh";

        canvas.style.touchAction =
          "none";
      }

    } catch (_) {}
  }

  function createKeyboardEvent(
    type,
    data
  ) {

    try {

      const event =
        new KeyboardEvent(
          type,
          {
            key:
              data.key,

            code:
              data.key ===
                "ArrowUp"
                ? "ArrowUp"
                : data.key ===
                    "ArrowDown"
                  ? "ArrowDown"
                  : data.key ===
                      "ArrowLeft"
                    ? "ArrowLeft"
                    : data.key ===
                        "ArrowRight"
                      ? "ArrowRight"
                      : "Key" +
                        String(
                          data.key
                        ).toUpperCase(),

            keyCode:
              data.keyCode || 0,

            which:
              data.keyCode || 0,

            bubbles: true,

            cancelable: true
          }
        );

      return event;

    } catch (_) {

      return null;
    }
  }

  window.addEventListener(
    "message",
    function (event) {

      const data =
        event.data;

      if (
        !data ||
        !data.type
      ) {
        return;
      }

      if (
        data.type !==
          "keydown" &&
        data.type !==
          "keyup"
      ) {
        return;
      }

      const keyboardEvent =
        createKeyboardEvent(
          data.type,
          data
        );

      if (!keyboardEvent) {
        return;
      }

      try {

        window.dispatchEvent(
          keyboardEvent
        );

      } catch (_) {}

      try {

        document.dispatchEvent(
          keyboardEvent
        );

      } catch (_) {}

      try {

        if (
          document.activeElement
        ) {

          document.activeElement
            .dispatchEvent(
              keyboardEvent
            );
        }

      } catch (_) {}

    },
    false
  );

  let count = 0;

  const interval =
    setInterval(
      function () {

        resizeGame();

        count++;

        if (count >= 60) {

          clearInterval(
            interval
          );
        }

      },
      100
    );

  window.addEventListener(
    "resize",
    resizeGame
  );

  window.addEventListener(
    "orientationchange",
    function () {

      setTimeout(
        resizeGame,
        150
      );
    }
  );

})();
<\/script>
`;

      /*
        Put the base immediately after <head>.
      */

      if (
        /<head[^>]*>/i.test(
          finalHTML
        )
      ) {

        finalHTML =
          finalHTML.replace(
            /<head[^>]*>/i,
            match =>
              match +
              `<base href="${baseURL}">` +
              receiver
          );

      } else {

        finalHTML = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<base href="${baseURL}">
${receiver}
</head>
<body>
${finalHTML}
</body>
</html>
        `;
      }

      /*
        Revoke the previous Blob URL.
      */

      if (
        frame.dataset.blobUrl
      ) {

        try {

          URL.revokeObjectURL(
            frame.dataset.blobUrl
          );

        } catch (_) {}
      }

      const blob =
        new Blob(
          [finalHTML],
          {
            type:
              "text/html"
          }
        );

      const url =
        URL.createObjectURL(
          blob
        );

      frame.dataset.blobUrl =
        url;

      frame.onload =
        () => {

          loader.style.display =
            "none";

          try {

            frame.contentWindow
              .focus();

          } catch (_) {}
        };

      frame.src = url;
    }

    /* =====================================================
       LOAD CHAPTER
    ====================================================== */

    async function loadChapter(
      chapter
    ) {

      playSelect();

      gameStarted = true;

      releaseAllKeys();

      mainMenu.style.display =
        "none";

      loader.style.display =
        "flex";

      frame.style.display =
        "block";

      applyConfig();

      const chapterPath =
        `${REPO_BASE}chapter${chapter}/`;

      const chapterURL =
        `${chapterPath}index.html`;

      try {

        const response =
          await fetch(
            chapterURL,
            {
              method: "GET",
              cache: "no-cache"
            }
          );

        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );
        }

        const html =
          await response.text();

        if (
          !html ||
          html.trim().length === 0
        ) {

          throw new Error(
            "Chapter HTML is empty."
          );
        }

        injectAndLoad(
          html,
          chapterPath
        );

      } catch (error) {

        console.error(
          "Chapter loading failed:",
          error
        );

        /*
          Direct fallback.
        */

        frame.onload =
          () => {

            loader.style.display =
              "none";
          };

        frame.src =
          chapterURL;

    /* =====================================================

    function updateSelectedRow() {

      chapterRows.forEach(

      if (
        selectedIndex === null

          selectedIndex
        ];

      if (!row) {
        return;
      }

      row.classList.add(
        "selected"
      );

      try {

        row.scrollIntoView(
          {
            behavior:
              "smooth",

            block:
              "nearest"
          }
        );

      } catch (_) {}
    }

    function activateSelectedRow() {

      if (
        selectedIndex === null
      ) {
        return;
      }

      const row =
        chapterRows[
          selectedIndex
        ];

      if (!row) {
        return;
      }

      row.click();
    }

    function handleMenuNavigation(
      event
    ) {

      if (gameStarted) {
        return;
      }

      if (
        event.key ===
          "ArrowDown" ||
        event.key ===
          "ArrowUp"
      ) {

        event.preventDefault();

        if (
          selectedIndex === null
        ) {

          selectedIndex = 0;

        } else if (
          event.key ===
          "ArrowDown"
        ) {

          selectedIndex++;

          if (
            selectedIndex >=
            chapterRows.length
          ) {

            selectedIndex = 0;
          }

        } else {

          selectedIndex--;

          if (
            selectedIndex < 0
          ) {

            selectedIndex =
              chapterRows.length -
              1;
          }
        }

        playMove();

        updateSelectedRow();

      } else if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        activateSelectedRow();
      }
    }

    document.addEventListener(
      "keydown",
      handleMenuNavigation
    );

    /* =====================================================
       GLOBAL RELEASE
    ====================================================== */

    window.addEventListener(
      "blur",
      releaseAllKeys
    );

    document.addEventListener(
      "visibilitychange",
      () => {

        if (
          document.hidden
        ) {

          releaseAllKeys();

          releaseDpad();
        }
      }
    );

    /* =====================================================
       OLD DOMAIN
    ====================================================== */

    function checkOldDomain() {

      if (
        window.location.hostname ===
        "deltarunefullwebport.vercel.app"
      ) {

        const notice =
          document.getElementById(
            "notice-container"
          );

        if (!notice) {
          return;
        }

        notice.innerHTML = `
<div class="deactivation-warning">

This domain might get deactivated soon.
Please export your saves and switch to
the new official domain:

<br><br>

<a
  href="https://byalvaro19.github.io/deltarune/"
  target="_blank"
  rel="noopener noreferrer"
>
  byalvaro19.github.io/deltarune/
</a>

</div>
        `;
      }
    }

    /* =====================================================
       PWA SERVICE WORKER
    ====================================================== */

    function registerServiceWorker() {

      if (
        "serviceWorker" in navigator &&
        (
          location.protocol ===
            "https:" ||
          location.hostname ===
            "localhost" ||
          location.hostname ===
            "127.0.0.1"
        )
      ) {

        navigator.serviceWorker
          .register(
            "./sw.js"
          )
          .catch(
            error => {

              console.warn(
                "Service worker registration failed:",
                error
              );
            }
          );
      }
    }

    /* =====================================================
       INITIALIZATION
    ====================================================== */

    function initialize() {

      checkOldDomain();

      try {

        const savedMobile =
          localStorage.getItem(
            MOBILE_KEY
          );

        useMobileControls =
          savedMobile ===
          "true";

      } catch (_) {

        useMobileControls =
          false;
      }

      updateMobileText();

      loadConfig();

      const opacitySlider =
        document.getElementById(
          "opacity-slider"
        );

      const sizeSlider =
        document.getElementById(
          "size-slider"
        );

      opacitySlider.value =
        String(
          config.opacity
        );

      sizeSlider.value =
        String(
          config.scale
        );

      applyConfig();

      registerServiceWorker();
    }

    /* =====================================================
       START
    ====================================================== */

    if (
      document.readyState ===
      "loading"
    ) {

      document.addEventListener(
        "DOMContentLoaded",
        initialize,
        {
          once: true
        }
      );

    } else {

      initialize();
    }

  </script>

</body>
</html>
