<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1,
  maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DELTARUNE">

<title>DELTARUNE</title>

<link rel="manifest" href="./manifest.json">

<link rel="icon" type="image/png" href="./icons/appicon.png">
<link rel="apple-touch-icon" href="./icons/appicon.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

/* =========================================================
   DELTARUNE FONT
========================================================= */

@font-face {
  font-family: "Deltarune";
  src:
    url("./font.otf") format("opentype"),
    url("https://cdn.jsdelivr.net/gh/ByAlvaro19/deltarune/font.otf")
    format("opentype");
  font-display: block;
}

/* =========================================================
   GLOBAL
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;

  background: #000;
  color: #fff;

  overflow: hidden;
}

body {
  font-family:
    "Deltarune",
    monospace;
}

/* =========================================================
   MAIN MENU
========================================================= */

#main-menu-ui {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;
  height: 100dvh;

  overflow-y: auto;
  overflow-x: hidden;

  display: flex;
  flex-direction: column;
  align-items: center;

  padding:
    max(20px, env(safe-area-inset-top))
    20px
    100px;

  background: #000;

  z-index: 10;

  touch-action: pan-y;
}

#main-menu-ui::-webkit-scrollbar {
  display: none;
}

.logo-container {
  width: 100%;

  display: flex;
  justify-content: center;
  align-items: center;

  pointer-events: none;
}

.logo {
  width: min(700px, 90vw);
  height: auto;

  max-height: 200px;

  object-fit: contain;

  display: block;

  image-rendering: auto;
}

.menu {
  width: min(90vw, 800px);

  margin: 20px auto 0;

  display: flex;
  flex-direction: column;
  align-items: stretch;
}

.row,
.disabled-row {
  position: relative;

  width: 100%;

  display: grid;

  grid-template-columns:
    minmax(150px, 200px)
    minmax(0, 1fr)
    60px;

  align-items: center;

  padding: 12px 0;

  gap: 16px;

  color: #fff;

  text-decoration: none;

  touch-action: manipulation;

  transition:
    transform .08s ease,
    filter .08s ease;
}

.row {
  cursor: pointer;
}

.disabled-row {
  opacity: .55;
}

.chapter,
.title,
.disabled-title,
.badge {
  display: inline-block;

  transform: scaleY(1.1);

  transform-origin: bottom;
}

.chapter {
  text-align: left;
}

.title,
.disabled-title {
  text-align: center;
}

.row img,
.disabled-row img {
  width: 60px;
  height: 50px;

  object-fit: contain;

  image-rendering: pixelated;
}

.row:hover .chapter,
.row:hover .title,
.row.selected .chapter,
.row.selected .title {
  color: #fefe00;
}

.row:hover img,
.row.selected img {
  filter: sepia(1) saturate(100);
}

.row:active {
  transform: scale(.985);
}

.row.touch-selected .chapter,
.row.touch-selected .title {
  color: #fefe00;
}

.row.touch-selected img {
  filter: sepia(1) saturate(100);
}

.deactivation-warning {
  width: min(90vw, 700px);

  margin: 10px auto 20px;

  text-align: center;

  font-family: Arial, sans-serif;

  font-size: 15px;

  line-height: 1.4;
}

.deactivation-warning a {
  color: #ffff00;
}

/* =========================================================
   LOADER
========================================================= */

#loader-screen {
  position: fixed;
  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  background: #000;
  color: #fff;

  z-index: 100;

  font-family:
    "Deltarune",
    monospace;
}

/* =========================================================
   GAME
========================================================= */

#game-frame {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100vh;
  height: 100dvh;

  border: 0;
  outline: 0;

  display: none;

  background: #000;

  z-index: 1;
}

/* =========================================================
   MOBILE HUD
========================================================= */

#hud-layer {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 20;

  display: none;

  pointer-events: none;

  opacity: var(--ctrl-opacity, 1);

  touch-action: none;
}

/* =========================================================
   PIXEL ART JOYSTICK
========================================================= */

#joystick {
  position: absolute;

  left: 55px;
  bottom: 55px;

  width: 145px;
  height: 145px;

  background: transparent;

  border: 0;

  pointer-events: auto;
  touch-action: none;

  transform:
    scale(var(--ctrl-scale, 1.3));

  transform-origin: center center;

  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;

  image-rendering: pixelated;
}

/* =========================================================
   PIXEL JOYSTICK OUTER BODY
========================================================= */

#joystick::before {
  content: "";

  position: absolute;

  inset: 10px;

  background: #1b1b1b;

  clip-path: polygon(
    20px 0,
    calc(100% - 20px) 0,

    calc(100% - 20px) 5px,
    calc(100% - 10px) 5px,

    calc(100% - 10px) 15px,
    100% 15px,

    100% calc(100% - 15px),
    calc(100% - 10px) calc(100% - 15px),

    calc(100% - 10px) calc(100% - 5px),
    calc(100% - 20px) calc(100% - 5px),

    calc(100% - 20px) 100%,
    20px 100%,

    20px calc(100% - 5px),
    10px calc(100% - 5px),

    10px calc(100% - 15px),
    0 calc(100% - 15px),

    0 15px,
    10px 15px,

    10px 5px,
    20px 5px
  );

  box-shadow:
    4px 4px 0 #000;

  pointer-events: none;
}

/* =========================================================
   PIXEL JOYSTICK INNER AREA
========================================================= */

#joystick::after {
  content: "";

  position: absolute;

  inset: 22px;

  background: #303030;

  clip-path: polygon(
    14px 0,
    calc(100% - 14px) 0,

    calc(100% - 14px) 5px,
    calc(100% - 5px) 5px,

    calc(100% - 5px) 14px,
    100% 14px,

    100% calc(100% - 14px),
    calc(100% - 5px) calc(100% - 14px),

    calc(100% - 5px) calc(100% - 5px),
    calc(100% - 14px) calc(100% - 5px),

    calc(100% - 14px) 100%,
    14px 100%,

    14px calc(100% - 5px),
    5px calc(100% - 5px),

    5px calc(100% - 14px),
    0 calc(100% - 14px),

    0 14px,
    5px 14px,

    5px 5px,
    14px 5px
  );

  pointer-events: none;
}

/* =========================================================
   PIXEL THUMBSTICK
========================================================= */

#joystick-stick {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 58px;
  height: 58px;

  margin-left: -29px;
  margin-top: -29px;

  background: #454545;

  border: 0;

  clip-path: polygon(
    12px 0,
    46px 0,

    46px 4px,
    54px 4px,

    54px 12px,
    58px 12px,

    58px 46px,
    54px 46px,

    54px 54px,
    46px 54px,

    46px 58px,
    12px 58px,

    12px 54px,
    4px 54px,

    4px 46px,
    0 46px,

    0 12px,
    4px 12px,

    4px 4px,
    12px 4px
  );

  box-shadow:
    4px 4px 0 #0b0b0b;

  pointer-events: none;

  z-index: 2;

  transform: translate(0, 0);

  transition:
    transform .035s linear;

  image-rendering: pixelated;
}

#joystick-stick::after {
  content: "";

  position: absolute;

  left: 10px;
  top: 10px;

  width: 6px;
  height: 6px;

  background: #777;

  box-shadow:
    8px 0 #777,
    0 8px #777;

  pointer-events: none;
}

/* =========================================================
   PIXEL ART Z / X / C BUTTONS
========================================================= */

#mobile-buttons {
  position: absolute;

  right: 55px;
  bottom: 50px;

  display: flex;

  flex-direction: row;

  align-items: flex-start;

  gap: 12px;

  pointer-events: auto;

  touch-action: none;

  transform:
    scale(var(--ctrl-scale, 1.3));

  transform-origin: center center;

  user-select: none;
  -webkit-user-select: none;

  image-rendering: pixelated;
}

.game-btn {
  position: relative;

  width: 64px;
  height: 64px;

  display: flex;

  align-items: center;
  justify-content: center;

  background: #2a2a2a;

  border: 0;

  color: #f5f5f5;

  font-family:
    "Deltarune",
    monospace;

  font-size: 25px;

  font-weight: normal;

  line-height: 1;

  text-align: center;

  text-shadow:
    2px 2px 0 #000;

  clip-path: polygon(
    12px 0,
    52px 0,

    52px 4px,
    60px 4px,

    60px 12px,
    64px 12px,

    64px 52px,
    60px 52px,

    60px 60px,
    52px 60px,

    52px 64px,
    12px 64px,

    12px 60px,
    4px 60px,

    4px 52px,
    0 52px,

    0 12px,
    4px 12px,

    4px 4px,
    12px 4px
  );

  pointer-events: auto;

  touch-action: none;

  user-select: none;
  -webkit-user-select: none;

  box-shadow:
    4px 4px 0 #0b0b0b;

  transition:
    transform .04s steps(1),
    background .04s steps(1);
}

.game-btn::before {
  content: "";

  position: absolute;

  inset: 7px;

  border: 2px solid #171717;

  clip-path: polygon(
    8px 0,
    calc(100% - 8px) 0,

    calc(100% - 8px) 4px,
    calc(100% - 4px) 4px,

    calc(100% - 4px) 8px,
    100% 8px,

    100% calc(100% - 8px),
    calc(100% - 4px) calc(100% - 8px),

    calc(100% - 4px) calc(100% - 4px),
    calc(100% - 8px) calc(100% - 4px),

    calc(100% - 8px) 100%,
    8px 100%,

    8px calc(100% - 4px),
    4px calc(100% - 4px),

    4px calc(100% - 8px),
    0 calc(100% - 8px),

    0 8px,
    4px 8px,

    4px 4px,
    8px 4px
  );

  pointer-events: none;
}

.game-btn::after {
  content: "";

  position: absolute;

  left: 12px;
  top: 12px;

  width: 5px;
  height: 5px;

  background: #505050;

  box-shadow:
    7px 0 #505050,
    0 7px #505050;

  opacity: .75;

  pointer-events: none;
}

.game-btn:nth-child(1) {
  transform: translateY(0);
}

.game-btn:nth-child(2) {
  transform: translateY(-21px);
}

.game-btn:nth-child(3) {
  transform: translateY(-42px);
}

.game-btn.active {
  background: #555;

  color: #fff;

  transform:
    translateY(0)
    scale(.88);

  box-shadow:
    2px 2px 0 #0b0b0b;
}

.game-btn:nth-child(2).active {
  transform:
    translateY(-21px)
    scale(.88);
}

.game-btn:nth-child(3).active {
  transform:
    translateY(-42px)
    scale(.88);
}

.game-btn[data-key="z"],
.game-btn[data-key="x"],
.game-btn[data-key="c"] {
  font-family:
    "Deltarune",
    monospace;

  color: #f5f5f5;

  text-shadow:
    2px 2px 0 #000;
}

/* =========================================================
   SETTINGS
========================================================= */

#settings-bar {
  position: fixed;

  top:
    max(
      10px,
      env(safe-area-inset-top)
    );

  right:
    max(
      10px,
      env(safe-area-inset-right)
    );

  z-index: 50;

  display: none;

  gap: 5px;
}

#settings-toggle {
  padding: 9px 12px;

  color: #fff;

  background: #111;

  border: 2px solid #fff;

  border-radius: 0;

  font-family:
    "Deltarune",
    monospace;

  box-shadow:
    3px 3px 0 #000;

  cursor: pointer;
}

#settings-panel {
  position: fixed;

  top:
    max(
      60px,
      calc(
        env(safe-area-inset-top) + 50px
      )
    );

  right:
    max(
      10px,
      env(safe-area-inset-right)
    );

  width: 230px;

  padding: 18px;

  display: none;

  background: #000;

  border: 2px solid #fff;

  border-radius: 0;

  z-index: 49;

  font-family:
    "Deltarune",
    monospace;

  box-shadow:
    5px 5px 0 #000;
}

#settings-panel input {
  width: 100%;
}

#reset-pos {
  width: 100%;

  margin-top: 10px;

  padding: 10px;

  background: #000;

  color: #fff;

  border: 2px solid #fff;

  border-radius: 0;

  font-family:
    "Deltarune",
    monospace;
}

body.edit-mode #joystick,
body.edit-mode #mobile-buttons {
  outline:
    2px dashed #00bfff;

  background:
    rgba(0,191,255,.12);
}

@media (max-width: 700px) {

  #main-menu-ui {
    padding-top:
      max(
        10px,
        env(safe-area-inset-top)
      );
  }

  .logo {
    width: 90vw;
    max-height: 150px;
  }

  .menu {
    width: 94vw;
  }

  .row,
  .disabled-row {
    grid-template-columns:
      110px
      minmax(0, 1fr)
      48px;

    gap: 8px;

    font-size: 22px;
  }

  .row img,
  .disabled-row img {
    width: 48px;
    height: 42px;
  }

  #joystick {
    left: 65px;
    bottom: 75px;

    width: 135px;
    height: 135px;
  }

  #joystick-stick {
    width: 62px;
    height: 62px;

    margin-left: -31px;
    margin-top: -31px;
  }

  #mobile-buttons {
    right: 45px;
    bottom: 65px;
  }

  .game-btn {
    width: 60px;
    height: 60px;

    font-size: 24px;
  }

}

@media (max-width: 450px) {

  .row,
  .disabled-row {
    grid-template-columns:
      90px
      minmax(0,1fr)
      42px;

    font-size: 18px;
  }

  #joystick {
    left: 30px;
    bottom: 35px;

    width: 120px;
    height: 120px;
  }

  #joystick-stick {
    width: 55px;
    height: 55px;

    margin-left: -27.5px;
    margin-top: -27.5px;
  }

  #mobile-buttons {
    right: 25px;
    bottom: 30px;

    gap: 8px;
  }

  .game-btn {
    width: 55px;
    height: 55px;

    font-size: 21px;
  }

}

#joystick,
#joystick *,
#mobile-buttons,
#mobile-buttons * {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

</style>
</head>

<body>

<div id="main-menu-ui">

  <div class="logo-container">

    <img
      class="logo"
      src="https://cdn.jsdelivr.net/gh/ByAlvaro19/deltarune/logo.png"
      alt="DELTARUNE"
      draggable="false"
    >

  </div>

  <div id="notice-container"></div>

  <div class="menu">

    <a href="#" class="row" data-chapter="1">
      <span class="chapter">CHAPTER 1</span>
      <span class="title">The Beginning</span>
      <img
        src="https://cdn.jsdelivr.net/gh/ByAlvaro19/deltarune/icons/1.png"
        draggable="false"
      >
    </a>

    <a href="#" class="row" data-chapter="2">
      <span class="chapter">CHAPTER 2</span>
      <span class="title">A Cyber's World</span>
      <img
        src="https://cdn.jsdelivr.net/gh/ByAlvaro19/deltarune/icons/2.png"
        draggable="false"
      >
    </a>

    <a href="#" class="row" data-chapter="3">
      <span class="chapter">CHAPTER 3</span>
      <span class="title">Late Night</span>
      <img
        src="https://cdn.jsdelivr.net/gh/ByAlvaro19/deltarune/icons/3.png"
        draggable="false"
      >
    </a>

    <a href="#" class="row" data-chapter="4">
      <span class="chapter">CHAPTER 4</span>

    </a>

    <a href="#" class="row" data-chapter="5">

    <a href="#" class="row" id="mobile-controls-row">

  </div>
</div>

    Reset Layout
  </button>

<script>

"use strict";

/* =========================================================
   REPOSITORY
========================================================= */

const REPO_BASE =
  "https://cdn.jsdelivr.net/gh/ByAlvaro19/deltarune/";

/* =========================================================
   ELEMENTS
========================================================= */

const frame =
  document.getElementById("game-frame");

const hud =
  document.getElementById("hud-layer");

const menu =
  document.getElementById("main-menu-ui");

const loader =
  document.getElementById("loader-screen");

const joystick =
  document.getElementById("joystick");

const joystickStick =
  document.getElementById("joystick-stick");

const mobileRow =
  document.getElementById("mobile-controls-row");

const mobileStatus =
  document.getElementById(
    "mobile-controls-status-text"
  );

const settingsBar =
  document.getElementById("settings-bar");

const settingsPanel =
  document.getElementById("settings-panel");

const importFile =
  document.getElementById("importFile");

/* =========================================================
   AUDIO
========================================================= */

const sndSelect =
  new Audio(
    REPO_BASE + "audios/snd_select.mp3"
  );

sndSelect.preload = "auto";

function playSelect() {

  try {

    sndSelect.currentTime = 0;

    const p =
      sndSelect.play();

    if (p) {
      p.catch(() => {});
    }

  } catch (_) {}

}

/* =========================================================
   STATE
========================================================= */

let gameStarted = false;

let mobileControls = false;

let selectedIndex = null;

let joystickPointer = null;

/*
 * Guarda as direções atualmente seguradas
 * pelo joystick.
 */
const joystickDirections =
  new Set();

/*
 * Timer responsável por manter o input
 * sendo enviado enquanto o stick estiver preso.
 */
let joystickHoldTimer = null;

const activeKeys =
  new Set();

const MOBILE_KEY =
  "deltarune-mobile-toggle";

const CONFIG_KEY =
  "deltarune-mobile-config";

  opacity: 1,
  scale: 1.3
};

/* =========================================================
   KEY MAP
========================================================= */

const keyMap = {

  ArrowUp: 38,
  ArrowDown: 40,
  ArrowLeft: 37,
  ArrowRight: 39,

  z: 90,
  x: 88,
  c: 67

};

/* =========================================================
   SEND INPUT
========================================================= */

function sendGameKey(type, key, repeat = false) {

  try {

    const win =
      frame.contentWindow;

    if (!win) {
      return;
    }

    const doc =
      win.document;

    const canvas =
      doc.getElementById("canvas");

    const keyCode =
      keyMap[key] || 0;

    const keyName =
      key === "ArrowUp"
        ? "ArrowUp"
        : key === "ArrowDown"
          ? "ArrowDown"
          : key === "ArrowLeft"
            ? "ArrowLeft"
            : key === "ArrowRight"
              ? "ArrowRight"
              : key.toUpperCase();

    const event =
      new KeyboardEvent(
        type,
        {
          key: keyName,

          code:
            key.startsWith("Arrow")
              ? key
              : "Key" +
                key.toUpperCase(),

          bubbles: true,

          cancelable: true,

          composed: true,

          repeat: repeat
        }
      );

    try {

      Object.defineProperty(
        event,
        "keyCode",
        {
          get: () => keyCode
        }
      );

      Object.defineProperty(
        event,
        "which",
        {
          get: () => keyCode
        }
      );

      Object.defineProperty(
        event,
        "charCode",
        {
          get: () => 0
        }
      );

    } catch (_) {}

    (canvas || doc)
      .dispatchEvent(event);

  } catch (error) {

    console.warn(
      "Deltarune input:",
      error
    );

  }

}

/* =========================================================
   UPDATE KEY
========================================================= */

function updateKey(key, down) {

  if (!keyMap[key]) {
    return;
  }

  if (down) {

    if (activeKeys.has(key)) {
      return;
    }

    activeKeys.add(key);

    sendGameKey(
      "keydown",
      key,
      false
    );

  } else {

    if (!activeKeys.has(key)) {
      return;
    }

    activeKeys.delete(key);

    sendGameKey(
      "keyup",
      key,
      false
    );

  }

}

/* =========================================================
   JOYSTICK CONTINUOUS HOLD
========================================================= */

const JOYSTICK_REPEAT_MS = 45;

function startJoystickHold() {

  if (joystickHoldTimer !== null) {
    return;
  }

  joystickHoldTimer =
    setInterval(
      () => {

        if (
          !gameStarted ||
          !mobileControls ||
          joystickPointer === null
        ) {
          return;
        }

        /*
         * Reenvia keydown continuamente.
         * Isso faz jogos que dependem de eventos
         * repetidos continuarem andando.
         */
        joystickDirections.forEach(
          key => {

            sendGameKey(
              "keydown",
              key,
              true
            );

          }
        );

      },
      JOYSTICK_REPEAT_MS
    );

}

function stopJoystickHold() {

  if (
    joystickHoldTimer !== null
  ) {

    clearInterval(
      joystickHoldTimer
    );

    joystickHoldTimer = null;

  }

}

function setJoystickDirection(
  key,
  shouldHold
) {

  if (shouldHold) {

    /*
     * Adiciona a direção ao conjunto
     * de direções seguradas.
     */
    if (
      !joystickDirections.has(key)
    ) {

      joystickDirections.add(key);

      /*
       * Primeiro input acontece imediatamente.
       */
      updateKey(
        key,
        true
      );

    }

    startJoystickHold();

  } else {

    /*
     * Remove somente essa direção.
     */
    if (
      joystickDirections.has(key)
    ) {

      joystickDirections.delete(key);

      updateKey(
        key,
        false
      );

    }

    if (
      joystickDirections.size === 0
    ) {

      stopJoystickHold();

    }

  }

}

function releaseJoystickDirections() {

  stopJoystickHold();

  for (
    const key of Array.from(
      joystickDirections
    )
  ) {

    updateKey(
      key,
      false
    );

  }

  joystickDirections.clear();

}

function releaseAllKeys() {

  releaseJoystickDirections();

  for (
    const key of Array.from(activeKeys)
  ) {

    sendGameKey(
      "keyup",
      key,
      false
    );

    activeKeys.delete(key);

  }

}

/* =========================================================
   JOYSTICK
========================================================= */

function resetJoystick() {

  joystickStick.style.transform =
    "translate(0px, 0px)";

}

function joystickMove(x, y) {

  const rect =
    joystick.getBoundingClientRect();

  const cx =
    rect.left +
    rect.width / 2;

  const cy =
    rect.top +
    rect.height / 2;

  let dx =
    x - cx;

  let dy =
    y - cy;

  const radius =
    rect.width * .34;

  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  if (distance > radius) {

    const factor =
      radius / distance;

    dx *= factor;
    dy *= factor;

  }

  joystickStick.style.transform =
    `translate(${dx}px, ${dy}px)`;

  const deadzone = 18;

  /*
   * Direções do joystick.
   *
   * Enquanto permanecerem true,
   * o sistema continuará enviando input.
   */
  setJoystickDirection(
    "ArrowUp",
    dy < -deadzone
  );

  setJoystickDirection(
    "ArrowDown",
    dy > deadzone
  );

  setJoystickDirection(
    "ArrowLeft",
    dx < -deadzone
  );

  setJoystickDirection(
    "ArrowRight",
    dx > deadzone
  );

}

joystick.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    joystickPointer =
      event.pointerId;

    try {

      joystick.setPointerCapture(
        event.pointerId
      );

    } catch (_) {}

    joystickMove(
      event.clientX,
      event.clientY
    );

  },
  {
    passive: false
  }
);

joystick.addEventListener(
  "pointermove",
  event => {

    if (
      event.pointerId !==
      joystickPointer
    ) {
      return;
    }

    event.preventDefault();

    joystickMove(
      event.clientX,
      event.clientY
    );

  },
  {
    passive: false
  }
);

function releaseJoystick(event) {

  if (
    joystickPointer !== null &&
    event.pointerId !==
    joystickPointer
  ) {
    return;
  }

  joystickPointer = null;

  resetJoystick();

  releaseJoystickDirections();

}

joystick.addEventListener(
  "pointerup",
  releaseJoystick
);

joystick.addEventListener(
  "pointercancel",
  releaseJoystick
);

joystick.addEventListener(
  "lostpointercapture",
  releaseJoystick
);

document

          event.pointerId;

        try {

          button.setPointerCapture(
            pointerId
          );

        } catch (_) {}

        updateKey(
          key,
          true
        );

        button.classList.add(
          "active"
        );

      },
      {
        passive: false
      }
    );

    function release(event) {

      if (
        pointerId !== null &&
        event.pointerId !==
        pointerId
      ) {
        return;
      }

      event.preventDefault();

      updateKey(
        key,
        false
      );

      button.classList.remove(
        "active"
      );

      pointerId = null;

    }

    button.addEventListener(
      "pointerup",
      release,
      {
        passive: false
      }
    );

    button.addEventListener(
      "pointercancel",
      release,
      {
        passive: false
      }
    );

    button.addEventListener(
      "lostpointercapture",
      () => {

        updateKey(
          key,
          false
        );

        button.classList.remove(
          "active"
        );

        pointerId = null;

      }
    );

  });

/* =========================================================
   LOAD CHAPTER
========================================================= */

async function loadChapter(chapter) {

  playSelect();

  gameStarted = true;

  releaseAllKeys();

  menu.style.display =
    "none";

  loader.style.display =
    "flex";

  frame.style.display =
    "block";

  hud.style.display =
    "none";

  settingsBar.style.display =
    "none";

  const chapterPath =
    `${REPO_BASE}chapter${chapter}/`;

  const chapterURL =
    `${chapterPath}index.html`;

  try {

    const response =
      await fetch(
        chapterURL,
        {
          cache: "no-cache"
        }
      );

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    const html =
      await response.text();

    if (!html.trim()) {

      throw new Error(
        "Empty chapter"
      );

    }

    let finalHTML =
      html.replace(
        /<base\b[^>]*>/gi,
        ""
      );

    if (
      /<head[^>]*>/i.test(
        finalHTML
      )
    ) {

      finalHTML =
        finalHTML.replace(
          /<head[^>]*>/i,
          match =>
            match +
            `<base href="${chapterPath}">`
        );

    } else {

      finalHTML =
`
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<base href="${chapterPath}">
</head>
<body>
${finalHTML}
</body>
</html>
`;

    }

    const blob =
      new Blob(
        [finalHTML],
        {
          type: "text/html"
        }
      );

    if (
      frame.dataset.blobUrl
    ) {

      try {

        URL.revokeObjectURL(
          frame.dataset.blobUrl
        );

      } catch (_) {}

    }

    const blobURL =
      URL.createObjectURL(
        blob
      );

    frame.dataset.blobUrl =
      blobURL;

    frame.onload =
      () => {

        loader.style.display =
          "none";

        updateHUD();

        try {

          frame.contentWindow.focus();

        } catch (_) {}

      };

    frame.onerror =
      () => {

        loader.style.display =
          "none";

        console.error(
          "Failed to load chapter iframe."
        );

      };

    frame.src =
      blobURL;

  } catch (error) {

    console.error(
      "Chapter loading error:",
      error
    );

    frame.onload =
      () => {

        loader.style.display =
          "none";

        updateHUD();

      };

    frame.src =
      chapterURL;

  }

}

/* =========================================================
   TOUCH CHAPTER NAVIGATION
========================================================= */

let touchStartY = null;
let touchStartX = null;
let touchMoved = false;

menu.addEventListener(
  "touchstart",
  event => {

    if (gameStarted) {
      return;
    }

    if (
      !event.touches ||
      !event.touches.length
    ) {
      return;
    }

    const touch =
      event.touches[0];

    touchStartY =
      touch.clientY;

    touchStartX =
      touch.clientX;

    touchMoved = false;

  },
  {
    passive: true
  }
);

menu.addEventListener(
  "touchmove",
  event => {

    if (
      touchStartY === null ||
      !event.touches.length
    ) {
      return;
    }

    const touch =
      event.touches[0];

    const dy =
      touch.clientY -
      touchStartY;

    const dx =
      touch.clientX -
      touchStartX;

    if (
      Math.abs(dy) > 10 ||
      Math.abs(dx) > 10
    ) {

      touchMoved = true;

    }

  },
  {
    passive: true
  }
);

menu.addEventListener(
  "touchend",
  event => {

    if (
      gameStarted ||
      touchStartY === null
    ) {
      return;
    }

    const touch =
      event.changedTouches &&
      event.changedTouches[0];

    if (!touch) {
      return;
    }

    const dy =
      touch.clientY -
      touchStartY;

    const dx =
      touch.clientX -
      touchStartX;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    if (
      distance > 35 &&
      Math.abs(dy) >
      Math.abs(dx)
    ) {

      if (
        dy < 0
      ) {

        moveSelection(1);

      } else {

        moveSelection(-1);

      }

    }

    touchStartY = null;
    touchStartX = null;
    touchMoved = false;

  },
  {
    passive: true
  }
);

/* =========================================================
   MENU SELECTION
========================================================= */

function setSelected(index) {

  if (
    !chapterRows.length
  ) {
    return;
  }

  if (
    index < 0
  ) {

    index =
      chapterRows.length - 1;

  }

  if (
    index >=
    chapterRows.length
  ) {

    index = 0;

  }

  selectedIndex =
    index;

  chapterRows.forEach(
    row => {

      row.classList.remove(
        "selected"
      );

      row.classList.remove(
        "touch-selected"
      );

    }
  );

  const row =
    chapterRows[
      selectedIndex
    ];

  if (!row) {
    return;
  }

  row.classList.add(
    "selected"
  );

  row.scrollIntoView({
    block: "nearest",
    behavior: "smooth"
  });

  playSelect();

}

function moveSelection(direction) {

  if (
    !chapterRows.length ||
    gameStarted
  ) {
    return;
  }

  if (
    selectedIndex === null
  ) {

    selectedIndex =
      direction > 0
        ? 0
        : chapterRows.length - 1;

    setSelected(
      selectedIndex
    );

    return;
  }

  setSelected(
    selectedIndex + direction
  );

}

/* =========================================================
   TAP A CHAPTER
========================================================= */

chapterRows.forEach(
  row => {

    row.addEventListener(

        passive: true
      }
    );

  }
);

/* =========================================================
   SAVE DATABASE
========================================================= */

const DB_NAME =
  "_savedata";

const STORE_NAME =
  "FILE_DATA";

function getDB() {

  return new Promise(
    (resolve, reject) => {

      const request =
        indexedDB.open(
          DB_NAME,
          1
        );

      request.onupgradeneeded =
        event => {

          const db =
            event.target.result;

          if (
            !db.objectStoreNames
              .contains(
                STORE_NAME
              )
          ) {

            db.createObjectStore(
              STORE_NAME
            );

          }

        };

      request.onsuccess =
        event =>
          resolve(
            event.target.result
          );

      request.onerror =
        event =>
          reject(
            event.target.error
          );

    }
  );

}

async function getAllSaves() {

  const db =
    await getDB();

  return new Promise(
    (resolve, reject) => {

      const transaction =
        db.transaction(
          STORE_NAME,
          "readonly"
        );

      const store =
        transaction.objectStore(
          STORE_NAME
        );

      const request =
        store.openCursor();

      const data = {};

      request.onsuccess =
        event => {

          const cursor =
            event.target.result;

          if (!cursor) {

            resolve(data);

            return;

          }

          data[cursor.key] =
            cursor.value;

          cursor.continue();

        };

      request.onerror =
        event =>
          reject(
            event.target.error
          );

    }
  );

}

async function setSaveItem(
  key,
  content
) {

  const db =
    await getDB();

  return new Promise(
    (resolve, reject) => {

      const transaction =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );

      const bytes =
        new TextEncoder()
          .encode(content);

      transaction
        .objectStore(
          STORE_NAME
        )
        .put(
          {
            timestamp: new Date(),
            mode: 33206,
            contents: bytes
          },
          key
        );

      transaction.oncomplete =
        resolve;

      transaction.onerror =
        event =>
          reject(
            event.target.error
          );

    }
  );

}

/* =========================================================
   EXPORT SAVE
========================================================= */

document
  .getElementById(
    "export-row"
  )
  .addEventListener(
    "click",
    async event => {

      event.preventDefault();

      if (gameStarted) {
        return;
      }

      playSelect();

      try {

        const allData =
          await getAllSaves();

        const zip =
          new JSZip();

        let hasData = false;

        for (
          const key in allData
        ) {

          const value =
            allData[key];

          if (
            !(
              key.includes("filech") ||
              key.includes("dr_") ||
              key.includes("_savedata")
            )
          ) {
            continue;
          }

          let cleanKey =
            String(key)
              .replace(
                /^\/_savedata\//,
                ""
              )
              .replace(
                /^_savedata\//,
                ""
              );

          let text = "";

          if (
            value &&
            value.contents
          ) {

            let contents =
              value.contents;

            if (
              contents instanceof
              ArrayBuffer
            ) {

              contents =
                new Uint8Array(
                  contents
                );

            }

            text =
              new TextDecoder()
                .decode(
                  contents
                );

          } else if (
            typeof value ===
            "string"
          ) {

            text = value;

          }

          zip.file(
            cleanKey,
            text
          );

          hasData = true;

        }

        if (!hasData) {

          alert(
            "No save data found!"
          );

          return;

        }

        const blob =
          await zip.generateAsync({
            type: "blob"
          });

        const url =
          URL.createObjectURL(
            blob
          );

        const link =
          document.createElement(
            "a"
          );

        link.href = url;

        link.download =
          "deltarune_saves.zip";

        document.body.appendChild(
          link
        );

        link.click();

        link.remove();

        setTimeout(
          () =>
            URL.revokeObjectURL(
              url
            ),
          1000
        );

      } catch (error) {

        console.error(
          "Export error:",
          error
        );

        alert(
          "Failed to export saves."
        );

      }

    }
  );

    if (!file) {
      return;
    }

    try {

      const zip =
        await JSZip.loadAsync(
          file
        );

      const promises = [];

      zip.forEach(
        (path, entry) => {

          if (entry.dir) {
            return;
          }

          promises.push(
            entry
              .async("string")
              .then(
                content => {

                  let key =
                    entry.name
                      .replace(
                        /^\/+/,
                        ""
                      )
                      .replace(
                        /^_savedata\//,
                        ""
                      );

                  key =
                    "/_savedata/" +
                    key;

                  return setSaveItem(
                    key,
                    content
                  );

                }
              )
          );

        }
      );

      await Promise.all(
        promises
      );

      alert(
        "Saves imported successfully!"
      );

      location.reload();

    } catch (error) {

      console.error(
        "Import error:",
        error
      );

      alert(
        "Error importing save ZIP."
      );

    }

    importFile.value = "";

  }
);

/* =========================================================
   OLD DOMAIN
========================================================= */

function checkOldDomain() {

  if (
    location.hostname ===
    "deltarunefullwebport.vercel.app"
  ) {

    const notice =
      document.getElementById(
        "notice-container"
      );

    notice.innerHTML = `
      <div class="deactivation-warning">

        This domain might get deactivated soon.
        Please export your saves and switch to
        the new official domain:

        <br><br>

        <a
          href="https://byalvaro19.github.io/deltarune/"
          target="_blank"
          rel="noopener noreferrer"
        >
          byalvaro19.github.io/deltarune/
        </a>

      </div>
    `;

  }

}

/* =========================================================
   LOAD CONFIG
========================================================= */

function loadConfig() {

  try {

    const saved =
      localStorage.getItem(
        CONFIG_KEY
      );

    if (saved) {

      const parsed =
        JSON.parse(saved);

      if (
        parsed &&
        typeof parsed ===
        "object"
      ) {

        if (
          typeof parsed.opacity ===
          "number"
        ) {

          config.opacity =
            parsed.opacity;

        }

        if (
          typeof parsed.scale ===
          "number"
        ) {

          config.scale =
            parsed.scale;

        }

      }

    }

  } catch (_) {}

}

/* =========================================================
   INITIALIZE
========================================================= */

function initialize() {

  checkOldDomain();

  try {

    mobileControls =
      localStorage.getItem(
        MOBILE_KEY
      ) === "true";

  } catch (_) {

    mobileControls = false;

  }

  loadConfig();

  document
    .getElementById(
      "opacity-slider"
    )
    .value =
    String(
      config.opacity
    );

  document
    .getElementById(
      "size-slider"
    )
    .value =
    String(
      config.scale
    );

  updateMobileText();

  applyConfig();

  hud.style.display =
    "none";

  settingsBar.style.display =
    "none";

}

window.addEventListener(
  "blur",
  releaseAllKeys
);

document.addEventListener(
  "visibilitychange",
  () => {

    if (document.hidden) {

      releaseAllKeys();

      resetJoystick();

      joystickPointer = null;

    }

  }
);

initialize();

</script>
